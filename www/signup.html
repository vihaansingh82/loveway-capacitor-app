<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loveway — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"><style>

/* Language switcher */
.lang-switcher{position:fixed;top:18px;right:22px;z-index:9999;display:flex;gap:5px;padding:5px;background:rgba(45,21,37,.88);border:1px solid rgba(255,79,123,.25);border-radius:50px;backdrop-filter:blur(12px);box-shadow:0 8px 25px rgba(0,0,0,.18)}
.lang-btn{border:0;background:transparent;color:var(--text-muted);padding:7px 10px;border-radius:30px;font:500 .72rem 'DM Sans',sans-serif;cursor:pointer;transition:.25s}
.lang-btn:hover{color:var(--white)}
.lang-btn.active{background:var(--pink);color:#fff;box-shadow:0 3px 10px rgba(255,79,123,.3)}
@media(max-width:600px){.lang-switcher{top:10px;right:10px}.lang-btn{padding:6px 8px;font-size:.68rem}}

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pink: #FF4F7B; --pink-light: #FF85A1; --pink-pale: #FFD6E0;
    --dark: #1A0A14; --dark2: #2D1525; --dark3: #3D1E30;
    --gold: #FFB347; --white: #FFF5F8; --text-muted: #C4849A;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--white); overflow-x: hidden; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 60px;
    background: rgba(26,10,20,0.9); backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,79,123,0.15);
  }
  nav ul { list-style: none; display: flex; gap: 32px; }
  nav ul li a { font-size:.875rem; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); text-decoration:none; transition:color .3s; }
  nav ul li a:hover, nav ul li a.active { color:var(--pink); }
  .nav-actions { display:flex; gap:12px; align-items:center; }
  .btn-ghost { padding:9px 22px; border-radius:50px; border:1px solid rgba(255,79,123,0.5); color:var(--pink); background:transparent; font-size:.875rem; cursor:pointer; transition:all .3s; text-decoration:none; display:inline-block; }
  .btn-ghost:hover { background:rgba(255,79,123,0.1); }
  .btn-primary { padding:9px 22px; border-radius:50px; background:var(--pink); color:#fff; border:none; font-size:.875rem; font-weight:500; cursor:pointer; transition:all .3s; text-decoration:none; display:inline-block; }
  .btn-primary:hover { background:#e03565; transform:translateY(-1px); }

  footer {
    background: var(--dark2); border-top:1px solid rgba(255,79,123,0.1);
    padding: 60px 60px 0; display:flex; flex-wrap:wrap; gap:40px; position:relative;
  }
  .footer-col { display:flex; flex-direction:column; gap:10px; min-width:140px; }
  .footer-col h4 { font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--pink); margin-bottom:4px; }
  .footer-col a { font-size:.85rem; color:var(--text-muted); text-decoration:none; transition:color .3s; }
  .footer-col a:hover { color:var(--pink); }
  .footer-bottom { width:100%; border-top:1px solid rgba(255,79,123,0.1); padding:20px 0; font-size:.8rem; color:var(--text-muted); text-align:center; margin-top:20px; }

  .section-tag { display:inline-flex; align-items:center; gap:8px; color:var(--pink); font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; margin-bottom:16px; }
  .section-tag::before { content:''; display:block; width:30px; height:1px; background:var(--pink); }
  .page-hero { padding: 140px 60px 80px; min-height: 50vh; position:relative; display:flex; align-items:center; }
  .page-hero-bg { position:absolute; inset:0; background: radial-gradient(ellipse 70% 60% at 30% 50%, rgba(255,79,123,0.14) 0%, transparent 65%), linear-gradient(160deg, #1A0A14 0%, #2D1525 50%, #1A0A14 100%); }
  .page-hero-content { position:relative; z-index:2; max-width:620px; }
  .page-hero h1 { font-family:'Playfair Display',serif; font-size:clamp(2.8rem,5vw,4.2rem); line-height:1.1; margin-bottom:20px; }
  .page-hero h1 em { color:var(--pink); font-style:italic; }
  .page-hero p { color:var(--text-muted); font-size:1.05rem; line-height:1.75; max-width:480px; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);} }
  .fade { animation: fadeUp .8s ease both; }
  .fade-1 { animation-delay:.1s; } .fade-2 { animation-delay:.2s; } .fade-3 { animation-delay:.3s; } .fade-4 { animation-delay:.4s; }
  .btn-hero { padding:14px 32px; border-radius:50px; font-size:1rem; font-weight:500; cursor:pointer; transition:all .3s; display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-family:'DM Sans',sans-serif; }
  .btn-hero.pink { background:var(--pink); color:#fff; border:none; box-shadow:0 8px 30px rgba(255,79,123,0.4); }
  .btn-hero.pink:hover { transform:translateY(-3px); box-shadow:0 12px 40px rgba(255,79,123,0.5); }
  .btn-hero.outline { background:transparent; color:var(--white); border:1px solid rgba(255,255,255,0.25); }
  .btn-hero.outline:hover { border-color:var(--pink); color:var(--pink); }
  input, textarea, select { width:100%; padding:13px 18px; background:var(--dark3); border:1px solid rgba(255,79,123,0.2); border-radius:12px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:.95rem; outline:none; transition:border .3s; }
  input:focus, textarea:focus, select:focus { border-color:var(--pink); }
  input::placeholder, textarea::placeholder { color:var(--text-muted); }
  label { font-size:.85rem; color:var(--text-muted); margin-bottom:6px; display:block; }

  /* 7 bhaashaayein — chhoti screen par pill swipe hoti hai, katati nahi */
  .lang-switcher{max-width:calc(100vw - 36px);flex-wrap:nowrap;overflow-x:auto;
    scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
  .lang-switcher::-webkit-scrollbar{display:none}
  .lang-btn{flex:0 0 auto;white-space:nowrap}
  @media(max-width:560px){
    .lang-switcher{left:10px;right:10px;max-width:none;justify-content:flex-start}
    .lang-btn{padding:6px 9px;font-size:.66rem}
  }
</style>
<style>
  .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 20px 40px;position:relative;overflow:hidden;}
  .auth-bg{position:absolute;inset:0;background-image:url("auth-bg.jpg");background-size:cover;background-position:center;}
  .auth-bg-overlay{position:absolute;inset:0;background:rgba(26,10,20,0.82);backdrop-filter:blur(2px);}
  .auth-card{background:rgba(45,21,37,0.97);border:1px solid rgba(255,79,123,0.2);border-radius:28px;padding:44px;max-width:500px;width:100%;position:relative;z-index:2;box-shadow:0 40px 80px rgba(0,0,0,0.5);}
  .auth-logo{text-align:center;margin-bottom:20px;}
  .auth-logo img{height:72px;object-fit:contain;filter:drop-shadow(0 4px 16px rgba(255,79,123,0.35));}
  .auth-title{font-family:'Playfair Display',serif;font-size:1.7rem;text-align:center;margin-bottom:4px;}
  .auth-sub{text-align:center;font-size:.875rem;color:var(--text-muted);margin-bottom:24px;}
  .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-group{margin-bottom:14px;}
  .gender-row{display:flex;gap:10px;margin-top:6px;}
  .gender-opt{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;background:var(--dark);border:1px solid rgba(255,79,123,0.2);border-radius:10px;font-size:.85rem;cursor:pointer;transition:all .3s;user-select:none;}
  .gender-opt.active{border-color:var(--pink);background:rgba(255,79,123,0.12);color:var(--pink);}
  .auth-btn{width:100%;padding:14px;border-radius:12px;background:var(--pink);color:#fff;border:none;font-size:1rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;transition:all .3s;box-shadow:0 8px 24px rgba(255,79,123,0.3);}
  .auth-btn:hover:not(:disabled){background:#e03565;transform:translateY(-2px);}
  .auth-btn:disabled{opacity:.6;cursor:not-allowed;}
  .auth-footer-text{text-align:center;font-size:.875rem;color:var(--text-muted);margin-top:16px;}
  .auth-footer-text a{color:var(--pink);text-decoration:none;}
  .auth-divider{display:flex;align-items:center;gap:14px;margin:18px 0;}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:rgba(255,79,123,0.15);}
  .auth-divider span{font-size:.8rem;color:var(--text-muted);}
  .social-login-btn{width:100%;padding:12px;background:var(--dark);border:1px solid rgba(255,79,123,0.15);border-radius:12px;text-align:center;cursor:pointer;transition:all .3s;color:var(--white);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.85rem;}
  .social-login-btn:hover{border-color:var(--pink);}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:44px;}
  .pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text-muted);font-size:1rem;background:none;border:none;}
  .alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:.875rem;display:none;}
  .alert.error{background:rgba(255,79,79,0.15);border:1px solid rgba(255,79,79,0.3);color:#ff8080;}
  .alert.success{background:rgba(76,175,80,0.15);border:1px solid rgba(76,175,80,0.3);color:#81c784;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lw-core.js?v=2"></script>
<style>
/* --- Supabase auth ke baad ke layout fixes --- */
.tab-row .tab{font-size:.78rem;padding:9px 4px;}
.social-logins{flex-direction:column;gap:10px;}
.social-login-btn{width:100%;}
#spotifyBtn{border-color:rgba(30,215,96,.28);}
#spotifyBtn:hover{border-color:#1ed760;background:rgba(30,215,96,.08);}
@media(max-width:420px){.tab-row .tab{font-size:.7rem;padding:8px 2px;}}
</style>
</head>
<body>
<div class="lang-switcher" aria-label="Language selector">
  <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
  <button class="lang-btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
  <button class="lang-btn" data-lang="braj" onclick="setLanguage('braj')">ब्रज</button>
  <button class="lang-btn" data-lang="raj" onclick="setLanguage('raj')">राजस्थानी</button>
  <button class="lang-btn" data-lang="bho" onclick="setLanguage('bho')">भोजपुरी</button>
  <button class="lang-btn" data-lang="hyd" onclick="setLanguage('hyd')">हैदराबादी</button>
  <button class="lang-btn" data-lang="mr" onclick="setLanguage('mr')">मराठी</button>
</div>

<div class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-bg-overlay"></div>
  <div class="auth-card">
    <div class="auth-logo"><img src="logo.png" alt="Loveway"></div>
    <div class="auth-title" data-i18n="signupTitle"></div>
    <div class="auth-sub" data-i18n="signupSub"></div>

    <div id="alertBox" class="alert"></div>

    <div class="form-row-2">
      <div class="form-group"><label data-i18n="fullName"></label><input type="text" id="fullName" data-i18n-placeholder="fullNamePh" placeholder="Vinay Vyas"></div>
      <div class="form-group"><label data-i18n="username"></label><input type="text" id="username" data-i18n-placeholder="placeholderUser" placeholder="vihaansingh82"></div>
    </div>
    <div class="form-group"><label data-i18n="email"></label><input type="email" id="email" autocomplete="email" data-i18n-placeholder="emailPh" placeholder="rahul@example.com"></div>
    <div class="form-group"><label data-i18n="mobile"></label><input type="tel" id="mobile" data-i18n-placeholder="placeholderMobile" placeholder="8368655079"></div>
    <div class="form-group"><label data-i18n="address"></label><input type="text" id="address" data-i18n-placeholder="addressPh" placeholder="123, Green Street, Delhi"></div>
    <div class="form-group"><label data-i18n="gender"></label>
      <div class="gender-row">
        <div class="gender-opt active" data-val="male" onclick="selectGender(this)" data-i18n="male"></div>
        <div class="gender-opt" data-val="female" onclick="selectGender(this)" data-i18n="female"></div>
        <div class="gender-opt" data-val="other" onclick="selectGender(this)" data-i18n="other"></div>
      </div>
    </div>
    <div class="form-group"><label data-i18n="dob"></label><input type="date" id="dob"></div>
    <div class="form-group"><label data-i18n="password"></label><div class="pw-wrap"><input type="password" id="password" data-i18n-placeholder="minPass" placeholder="Min 6 characters"><button type="button" class="pw-toggle" onclick="togglePw('password',this)">👁</button></div></div>
    <div class="form-group"><label data-i18n="confirmPass"></label><div class="pw-wrap"><input type="password" id="confirmPw" data-i18n-placeholder="confirmPass" placeholder="Password dobara daalo"><button type="button" class="pw-toggle" onclick="togglePw('confirmPw',this)">👁</button></div></div>

    <button class="auth-btn" id="signupBtn" onclick="doSignup()" data-i18n="sendOtp"></button>
    <div class="auth-divider"><span data-i18n="or"></span></div>
    <a href="#" class="social-login-btn" id="googleBtn" onclick="LW.google(event)"><span data-i18n="googleSignup"></span></a>
    <a href="#" class="social-login-btn" id="spotifyBtn" onclick="LW.spotify(event)">🎵 Spotify se sign up</a>
    <div class="auth-footer-text"><span data-i18n="haveAccount"></span> <a href="login.html" data-i18n="loginLink"></a></div>
  </div>
</div>


<script>
/* Signup — Supabase Auth se account banao.
   Extra fields user_metadata me jaate hain, DB trigger
   (lw_handle_new_user) unse profiles row bana deta hai. */
let gender = 'male';

function selectGender(el) {
  document.querySelectorAll('.gender-opt').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  gender = el.dataset.val;
}

function togglePw(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

const showAlert = (msg, type) => LW.alert(msg, type);

async function doSignup() {
  const btn      = document.getElementById('signupBtn');
  const fullName = document.getElementById('fullName').value.trim();
  const username = document.getElementById('username').value.trim();
  const email    = document.getElementById('email').value.trim();
  const mobile   = document.getElementById('mobile').value.trim();
  const address  = document.getElementById('address').value.trim();
  const dob      = document.getElementById('dob').value;
  const pass     = document.getElementById('password').value;
  const confirm  = document.getElementById('confirmPw').value;

  if (!fullName || !username || !email || !mobile || !pass) {
    showAlert(t('fillRequired'), 'error'); return;
  }
  if (pass.length < 6)   { showAlert(t('passShort'), 'error'); return; }
  if (pass !== confirm)  { showAlert(t('passMismatch'), 'error'); return; }
  if (!LW.configOk)      { showAlert('config.js me Supabase keys daalo.', 'error'); return; }

  btn.disabled = true;
  btn.textContent = t('sending');
  LW.hideAlert();

  try {
    // username free hai?
    const avail = await LW.sb.rpc('lw_username_available', { p_username: username });
    if (avail.data === false) {
      showAlert('❌ ' + t('userTaken'), 'error');
      btn.disabled = false; btn.textContent = t('sendOtp');
      return;
    }

    const { data, error } = await LW.sb.auth.signUp({
      email: email,
      password: pass,
      options: {
        emailRedirectTo: LW.pageUrl('callback.html'),
        data: {
          full_name: fullName,
          username: username,
          mobile: LW.normalizeMobile(mobile),
          address: address,
          gender: gender,
          dob: dob || null
        }
      }
    });

    if (error) {
      showAlert('❌ ' + LW.errText(error), 'error');
      btn.disabled = false; btn.textContent = t('sendOtp');
      return;
    }

    // Email confirmation ON hai aur ye email pehle se registered hai:
    // Supabase ek nakli user bhejta hai jiska identities[] khaali hota hai.
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      showAlert('❌ Ye email pehle se registered hai. <a href="login.html" style="color:var(--pink)">Login karein →</a>', 'error');
      btn.disabled = false; btn.textContent = t('sendOtp');
      return;
    }

    // session mil gaya (email confirmation OFF) -> seedha dashboard
    if (data.session) {
      showAlert('✅ ' + t('signupOk'), 'success');
      btn.textContent = 'Dashboard khul raha hai…';
      let next = 'dashboard.html';
      try {
        const p = await LW.getProfile();
        if (p) next = LW.targetFor(p);
      } catch (e) {
        console.warn('[Loveway] profile fetch fail, dashboard par bhej rahe hain:', e);
      }
      if (next === 'login.html') next = 'dashboard.html';   // loop se bacho
      LW.go(next);
      return;
    }

    // session nahi mila = email confirmation ON hai.
    // Supabase ne abhi confirmation email bhej diya hai, isliye
    // otp.html ko mode=signup bata do — wo dobara mail nahi bhejega
    // (warna Supabase "60 seconds" rate limit de deta hai).
    showAlert('✅ Code aapke email par bhej diya gaya hai.', 'success');
    btn.textContent = 'Verify page khul raha hai…';
    LW.go('otp.html?mode=signup&email=' + encodeURIComponent(email));
  } catch (e) {
    console.error('[Loveway] signup error:', e);
    showAlert('❌ ' + LW.errText(e), 'error');
    btn.disabled = false; btn.textContent = t('sendOtp');
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!LW.configOk) { showAlert('config.js me SUPABASE_ANON_KEY set nahi hai.', 'error'); return; }
  const session = await LW.getSession();
  if (session) {
    const p = await LW.getProfile();
    const next = LW.targetFor(p);
    LW.go(next === 'login.html' ? 'dashboard.html' : next);
  }
});
</script>
</body></html>
