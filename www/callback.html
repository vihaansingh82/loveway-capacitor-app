<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loveway — Signing you in</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--pink:#FF4F7B;--pink-light:#FF85A1;--dark:#1A0A14;--dark2:#2D1525;--white:#FFF5F8;--text-muted:#C4849A}
  body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;text-align:center}
  .glow{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,79,123,.16),transparent 60%);pointer-events:none}
  .box{position:relative;max-width:400px;width:100%}
  .heart{font-size:3rem;animation:beat 1.1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.18)}}
  h1{font-family:'Playfair Display',serif;font-size:1.6rem;margin:18px 0 8px}
  p{color:var(--text-muted);font-size:.92rem;line-height:1.6}
  .alert{display:none;margin-top:18px;padding:13px 16px;border-radius:12px;font-size:.88rem;text-align:left}
  .alert.error{display:block;background:rgba(255,79,123,.12);border:1px solid rgba(255,79,123,.4);color:var(--pink-light)}
  .alert.success{display:block;background:rgba(120,220,150,.1);border:1px solid rgba(120,220,150,.35);color:#8fe0aa}
  .btn{display:inline-block;margin-top:20px;padding:12px 26px;background:var(--pink);color:#fff;border:0;border-radius:30px;font:500 .9rem 'DM Sans',sans-serif;text-decoration:none;cursor:pointer}
  .btn:hover{background:#e03565}
  @media(prefers-reduced-motion:reduce){.heart{animation:none}}

  /* shared Loveway mark — sab pre-login pages par ek jaisa */
  .lw-mark{text-align:center;margin-bottom:18px}
  .lw-mark img{height:62px;width:auto;object-fit:contain;display:inline-block;
    filter:drop-shadow(0 4px 16px rgba(255,79,123,.35))}
  @media(max-width:520px){.lw-mark img{height:48px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lw-core.js?v=2"></script>
</head>
<body>
<div class="glow"></div>
<div class="box">
  <div class="lw-mark"><img src="logo.png" alt="Loveway" width="340" height="185"></div>
  <h1 id="headline" data-i18n="callbackRedirecting">Loveway me le ja rahe hain…</h1>
  <p id="sub" data-i18n="callbackCompletingMsg">Google se aaya sign-in complete kiya ja raha hai.</p>
  <div id="alertBox" class="alert"></div>
  <a href="login.html" class="btn" id="retry" style="display:none" data-i18n="callbackRetryLink">Login page par wapas</a>
</div>

<script>
/* Google / email-link se wapas aane par:
   session banne ka intezaar karo, phir profile ke hisaab se
   sahi page par bhej do. */
function fail(msg) {
  document.getElementById('headline').textContent = t('callbackFailedTitle');
  document.getElementById('sub').style.display = 'none';

  var lastProvider = null;
  try { lastProvider = sessionStorage.getItem('lw_last_oauth_provider'); sessionStorage.removeItem('lw_last_oauth_provider'); } catch (e) {}

  if (lastProvider === 'spotify') {
    LW.alert('❌ ' + msg + '<br><br>' + t('callbackSpotifyHint'), 'error');
  } else {
    LW.alert('❌ ' + msg, 'error');
  }
  document.getElementById('retry').style.display = 'inline-block';
}

async function finish() {
  if (!LW.configOk) { fail('config.js me SUPABASE_ANON_KEY set nahi hai.'); return; }

  // URL me provider ki error aayi ho to seedha dikha do
  var q = new URLSearchParams(window.location.search);
  var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  var err = q.get('error_description') || q.get('error') ||
            hash.get('error_description') || hash.get('error');
  if (err) { fail(decodeURIComponent(err)); return; }

  // supabase-js code exchange background me karta hai — thoda wait
  var session = null;
  for (var i = 0; i < 25 && !session; i++) {
    session = await LW.getSession();
    if (!session) await new Promise(function (r) { setTimeout(r, 200); });
  }
  if (!session) { fail(t('callbackNoSessionErr')); return; }

  var profile = await LW.getProfile();
  if (!profile) { fail(t('noProfile')); return; }

  var next = LW.targetFor(profile);
  document.getElementById('sub').textContent = t('callbackDoneRedirecting');
  LW.alert('✅ ' + (profile.full_name || profile.username || profile.email || ''), 'success');
  setTimeout(function () { window.location.replace(LW.pageUrl(next)); }, 500);
}

document.addEventListener('DOMContentLoaded', function () {
  finish().catch(function (e) { fail(LW.errText(e)); });
});
</script>
</body>
</html>
