<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loveway — Forgot Password</title>
<link rel="stylesheet" href="lw-styles.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lw-core.js?v=3"></script>
</head>
<body class="font-sans bg-bg text-text min-h-screen flex items-center justify-center px-5 py-10 relative overflow-hidden">
<div class="auth-bg"></div>
<div class="auth-bg-overlay"></div>
<div class="auth-card">
  <div class="auth-logo"><img src="logo.png" alt="Loveway"></div>
  <div class="auth-title">Password bhool gaye?</div>
  <div class="auth-sub leading-[1.6]">Apna email daalo — hum aapko 6-digit code bhejenge jisse aap naya password bana sakte hain.</div>

  <div id="alertBox" class="alert"></div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="fpEmail" autocomplete="username" placeholder="rahul@example.com">
  </div>

  <button class="auth-btn" id="fpBtn" onclick="sendResetCode()">Code bhejo</button>

  <div class="auth-footer-text"><a href="login.html">← Login par wapas</a></div>
</div>

<script>
const showAlert = (msg, type) => LW.alert(msg, type);

async function sendResetCode() {
  const email = document.getElementById('fpEmail').value.trim();
  if (!email || email.indexOf('@') < 1) { showAlert('❌ Sahi email daalo', 'error'); return; }
  if (!LW.configOk) { showAlert('❌ config.js me Supabase keys daalo.', 'error'); return; }

  const btn = document.getElementById('fpBtn');
  btn.disabled = true; btn.textContent = 'Bhej rahe hain…';
  LW.hideAlert();

  LW.go('otp.html?mode=reset&email=' + encodeURIComponent(email));
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') sendResetCode(); });

document.addEventListener('DOMContentLoaded', () => {
  if (!LW.configOk) showAlert('config.js me SUPABASE_ANON_KEY set nahi hai.', 'error');
});
</script>
</body></html>
