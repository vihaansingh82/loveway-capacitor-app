<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loveway — Account blocked</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700&family=DM+Sans:wght@300;400;500&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--pink:#FF4F7B;--pink-light:#FF85A1;--dark:#1A0A14;--dark2:#2D1525;--dark3:#3D1E30;--gold:#FFB347;--white:#FFF5F8;--text-muted:#C4849A}
  body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .glow{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,rgba(255,79,123,.15),transparent 62%);pointer-events:none}
  .lang-switcher{position:fixed;top:18px;right:22px;z-index:99;display:flex;gap:5px;padding:5px;background:rgba(45,21,37,.88);border:1px solid rgba(255,79,123,.25);border-radius:50px;backdrop-filter:blur(12px)}
  .lang-btn{border:0;background:transparent;color:var(--text-muted);padding:7px 10px;border-radius:30px;font:500 .72rem 'DM Sans',sans-serif;cursor:pointer;transition:.25s}
  .lang-btn:hover{color:var(--white)}
  .lang-btn.active{background:var(--pink);color:#fff}
  .card{position:relative;width:100%;max-width:520px;background:var(--dark2);border:1px solid rgba(255,79,123,.16);border-radius:26px;padding:44px 38px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.45)}
  .stamp{width:78px;height:78px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.1rem;background:rgba(255,179,71,.12);border:1px solid rgba(255,179,71,.4)}
  .card.bad .stamp{background:rgba(255,79,123,.12);border-color:rgba(255,79,123,.45)}
  h1{font-family:'Playfair Display',serif;font-size:1.75rem;line-height:1.25;margin-bottom:12px}
  .sub{color:var(--text-muted);font-size:.95rem;line-height:1.65;margin-bottom:26px}
  .track{display:flex;align-items:center;gap:0;margin:0 auto 28px;max-width:400px}
  .node{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
  .dot{width:15px;height:15px;border-radius:50%;background:var(--dark3);border:2px solid rgba(255,79,123,.3)}
  .node.done .dot{background:var(--pink);border-color:var(--pink)}
  .node.now .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 6px rgba(255,179,71,.14)}
  .node small{font-size:.7rem;color:var(--text-muted);letter-spacing:.03em}
  .node.done small,.node.now small{color:var(--white)}
  .bar{height:2px;flex:1;background:rgba(255,79,123,.22);margin-bottom:22px}
  .bar.filled{background:var(--pink)}
  .who{background:var(--dark3);border-radius:14px;padding:14px 16px;text-align:left;font-size:.86rem;color:var(--text-muted);margin-bottom:22px}
  .who b{color:var(--white);font-weight:500}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{padding:12px 24px;border-radius:30px;font:500 .88rem 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;border:0;transition:.25s}
  .btn.primary{background:var(--pink);color:#fff}
  .btn.primary:hover{background:#e03565}
  .btn.ghost{background:transparent;color:var(--white);border:1px solid rgba(255,79,123,.35)}
  .btn.ghost:hover{border-color:var(--pink)}
  .alert{display:none;margin-bottom:18px;padding:12px 15px;border-radius:12px;font-size:.87rem;text-align:left}
  .alert.success{display:block;background:rgba(120,220,150,.1);border:1px solid rgba(120,220,150,.32);color:#8fe0aa}
  .alert.warning{display:block;background:rgba(255,179,71,.1);border:1px solid rgba(255,179,71,.32);color:var(--gold)}
  .alert.error{display:block;background:rgba(255,79,123,.1);border:1px solid rgba(255,79,123,.35);color:var(--pink-light)}
  .note{margin-top:20px;font-size:.78rem;color:var(--text-muted)}
  .script{font-family:'Dancing Script',cursive;color:var(--pink-light);font-size:1.15rem}
  @media(max-width:520px){.card{padding:34px 22px}h1{font-size:1.45rem}.node small{font-size:.62rem}}

  /* shared Loveway mark — sab pre-login pages par ek jaisa */
  .lw-mark{text-align:center;margin-bottom:18px}
  .lw-mark img{height:62px;width:auto;object-fit:contain;display:inline-block;
    filter:drop-shadow(0 4px 16px rgba(255,79,123,.35))}
  @media(max-width:520px){.lw-mark img{height:48px}}

  /* 7 bhaashaayein — chhoti screen par pill swipe hoti hai, katati nahi */
  .lang-switcher{max-width:calc(100vw - 36px);flex-wrap:nowrap;overflow-x:auto;
    scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
  .lang-switcher::-webkit-scrollbar{display:none}
  .lang-btn{flex:0 0 auto;white-space:nowrap}
  @media(max-width:560px){
    .lang-switcher{left:10px;right:10px;max-width:none;justify-content:flex-start}
    .lang-btn{padding:6px 9px;font-size:.66rem}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lw-core.js?v=2"></script>
</head>
<body>
<div class="glow"></div>
<div class="lang-switcher" aria-label="Language selector">
  <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
  <button class="lang-btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
  <button class="lang-btn" data-lang="braj" onclick="setLanguage('braj')">ब्रज</button>
  <button class="lang-btn" data-lang="raj" onclick="setLanguage('raj')">राजस्थानी</button>
  <button class="lang-btn" data-lang="bho" onclick="setLanguage('bho')">भोजपुरी</button>
  <button class="lang-btn" data-lang="hyd" onclick="setLanguage('hyd')">हैदराबादी</button>
  <button class="lang-btn" data-lang="mr" onclick="setLanguage('mr')">मराठी</button>
</div>

<div class="card bad" id="card">
  <div class="lw-mark"><img src="logo.png" alt="Loveway" width="340" height="185"></div>
  <div class="stamp">✕</div>
  <h1 id="title" data-i18n="rejectedTitle"></h1>
  <div class="sub" id="sub" data-i18n="rejectedSub"></div>

  <div id="alertBox" class="alert"></div>

  <div class="who" id="who" style="display:none"></div>

  <div class="row">
    <a class="btn primary" href="contact.html" data-i18n="contactUs"></a>
    <button class="btn ghost" onclick="LW.logout()" data-i18n="signOut"></button>
  </div>

  <div class="note"><span class="script">Loveway</span></div>
</div>

<script>
/* blocked.html — sirf un accounts ke liye jinhe admin ne reject/block
   kiya hai. Approval ka intezaar wala step ab nahi hai: naya signup
   seedha approved hota hai, isliye baaki sab yahan se aage bhej diye
   jaate hain. */
async function check() {
  if (!LW.configOk) { LW.alert('config.js me SUPABASE_ANON_KEY set nahi hai.', 'error'); return; }

  const session = await LW.getSession();
  if (!session) { window.location.href = LW.pageUrl('login.html'); return; }

  const p = await LW.getProfile();
  if (!p) { window.location.href = LW.pageUrl('login.html'); return; }

  // block nahi hai? to yahan rukne ki zaroorat hi nahi
  if (p.status !== 'rejected') {
    window.location.replace(LW.pageUrl(LW.targetFor(p)));
    return;
  }

  const who = document.getElementById('who');
  who.style.display = 'block';
  who.innerHTML =
    '<b>' + LW.escapeHtml(p.full_name || p.username || '') + '</b><br>' +
    '@' + LW.escapeHtml(p.username || '—') + ' · ' + LW.escapeHtml(p.mobile || '—') + '<br>' +
    LW.escapeHtml(p.email || '');

  LW.alert('❌ ' + t('rejected'), 'error');
}

document.addEventListener('DOMContentLoaded', () => { check(); });
</script>
</body>
</html>
