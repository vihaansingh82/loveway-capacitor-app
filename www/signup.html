<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loveway — Sign Up</title>
<link rel="stylesheet" href="lw-styles.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lw-core.js?v=3"></script>
</head>
<body class="font-sans bg-bg text-text overflow-x-hidden">
<div class="lang-switcher" aria-label="Language selector">
  <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
  <button class="lang-btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
  <button class="lang-btn" data-lang="braj" onclick="setLanguage('braj')">ब्रज</button>
  <button class="lang-btn" data-lang="raj" onclick="setLanguage('raj')">राजस्थानी</button>
  <button class="lang-btn" data-lang="bho" onclick="setLanguage('bho')">भोजपुरी</button>
  <button class="lang-btn" data-lang="hyd" onclick="setLanguage('hyd')">हैदराबादी</button>
  <button class="lang-btn" data-lang="mr" onclick="setLanguage('mr')">मराठी</button>
</div>

<div class="min-h-screen flex items-center justify-center px-5 pt-[100px] pb-10 relative overflow-hidden">
  <div class="auth-bg"></div>
  <div class="auth-bg-overlay"></div>
  <div class="auth-card max-w-[500px]">
    <div class="auth-logo"><img src="logo.png" alt="Loveway"></div>
    <div class="auth-title" data-i18n="signupTitle"></div>
    <div class="auth-sub mb-6" data-i18n="signupSub"></div>

    <div id="alertBox" class="alert"></div>

    <div class="grid gap-3.5" style="grid-template-columns:1fr 1fr">
      <div class="form-group"><label data-i18n="fullName"></label><input type="text" id="fullName" data-i18n-placeholder="fullNamePh" placeholder="Vinay Vyas"></div>
      <div class="form-group"><label data-i18n="username"></label><input type="text" id="username" data-i18n-placeholder="placeholderUser" placeholder="vihaansingh82"></div>
    </div>
    <div class="form-group"><label data-i18n="email"></label><input type="email" id="email" autocomplete="email" data-i18n-placeholder="emailPh" placeholder="rahul@example.com"></div>
    <div class="form-group"><label data-i18n="mobile"></label><input type="tel" id="mobile" data-i18n-placeholder="placeholderMobile" placeholder="8368655079"></div>
    <div class="form-group"><label data-i18n="address"></label><input type="text" id="address" data-i18n-placeholder="addressPh" placeholder="123, Green Street, Delhi"></div>
    <div class="form-group"><label data-i18n="gender"></label>
      <div class="gender-row">
        <div class="gender-opt active" data-val="male" onclick="selectGender(this)" data-i18n="male"></div>
        <div class="gender-opt" data-val="female" onclick="selectGender(this)" data-i18n="female"></div>
        <div class="gender-opt" data-val="other" onclick="selectGender(this)" data-i18n="other"></div>
      </div>
    </div>
    <div class="form-group"><label data-i18n="dob"></label><input type="date" id="dob"></div>
    <div class="form-group"><label data-i18n="password"></label><div class="pw-wrap"><input type="password" id="password" data-i18n-placeholder="minPass" placeholder="Min 6 characters"><button type="button" class="pw-toggle" onclick="togglePw('password',this)">👁</button></div></div>
    <div class="form-group"><label data-i18n="confirmPass"></label><div class="pw-wrap"><input type="password" id="confirmPw" data-i18n-placeholder="confirmPass" placeholder="Password dobara daalo"><button type="button" class="pw-toggle" onclick="togglePw('confirmPw',this)">👁</button></div></div>

    <button class="auth-btn mt-2" id="signupBtn" onclick="doSignup()" data-i18n="sendOtp"></button>
    <div class="auth-divider"><span data-i18n="or"></span></div>
    <a href="#" class="social-login-btn" id="googleBtn" onclick="LW.google(event)"><span data-i18n="googleSignup"></span></a>
    <a href="#" class="social-login-btn mt-2.5" id="spotifyBtn" onclick="LW.spotify(event)">🎵 Spotify se sign up</a>
    <div class="auth-footer-text"><span data-i18n="haveAccount"></span> <a href="login.html" data-i18n="loginLink"></a></div>
  </div>
</div>


<script>
/* Signup — Supabase Auth se account banao.
   Extra fields user_metadata me jaate hain, DB trigger
   (lw_handle_new_user) unse profiles row bana deta hai. */
let gender = 'male';

function selectGender(el) {
  document.querySelectorAll('.gender-opt').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  gender = el.dataset.val;
}

function togglePw(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

const showAlert = (msg, type) => LW.alert(msg, type);

async function doSignup() {
  const btn      = document.getElementById('signupBtn');
  const fullName = document.getElementById('fullName').value.trim();
  const username = document.getElementById('username').value.trim();
  const email    = document.getElementById('email').value.trim();
  const mobile   = document.getElementById('mobile').value.trim();
  const address  = document.getElementById('address').value.trim();
  const dob      = document.getElementById('dob').value;
  const pass     = document.getElementById('password').value;
  const confirm  = document.getElementById('confirmPw').value;

  if (!fullName || !username || !email || !mobile || !pass) {
    showAlert(t('fillRequired'), 'error'); return;
  }
  if (pass.length < 6)   { showAlert(t('passShort'), 'error'); return; }
  if (pass !== confirm)  { showAlert(t('passMismatch'), 'error'); return; }
  if (!LW.configOk)      { showAlert('config.js me Supabase keys daalo.', 'error'); return; }

  btn.disabled = true;
  btn.textContent = t('sending');
  LW.hideAlert();

  try {
    // username free hai?
    const avail = await LW.sb.rpc('lw_username_available', { p_username: username });
    if (avail.data === false) {
      showAlert('❌ ' + t('userTaken'), 'error');
      btn.disabled = false; btn.textContent = t('sendOtp');
      return;
    }

    const { data, error } = await LW.sb.auth.signUp({
      email: email,
      password: pass,
      options: {
        emailRedirectTo: LW.pageUrl('callback.html'),
        data: {
          full_name: fullName,
          username: username,
          mobile: LW.normalizeMobile(mobile),
          address: address,
          gender: gender,
          dob: dob || null
        }
      }
    });

    if (error) {
      showAlert('❌ ' + LW.errText(error), 'error');
      btn.disabled = false; btn.textContent = t('sendOtp');
      return;
    }

    // Email confirmation ON hai aur ye email pehle se registered hai:
    // Supabase ek nakli user bhejta hai jiska identities[] khaali hota hai.
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      showAlert('❌ Ye email pehle se registered hai. <a href="login.html" style="color:var(--primary)">Login karein →</a>', 'error');
      btn.disabled = false; btn.textContent = t('sendOtp');
      return;
    }

    // session mil gaya (email confirmation OFF) -> seedha dashboard
    if (data.session) {
      showAlert('✅ ' + t('signupOk'), 'success');
      btn.textContent = 'Dashboard khul raha hai…';
      let next = 'dashboard.html';
      try {
        const p = await LW.getProfile();
        if (p) next = LW.targetFor(p);
      } catch (e) {
        console.warn('[Loveway] profile fetch fail, dashboard par bhej rahe hain:', e);
      }
      if (next === 'login.html') next = 'dashboard.html';   // loop se bacho
      LW.go(next);
      return;
    }

    // session nahi mila = email confirmation ON hai.
    // Supabase ne abhi confirmation email bhej diya hai, isliye
    // otp.html ko mode=signup bata do — wo dobara mail nahi bhejega
    // (warna Supabase "60 seconds" rate limit de deta hai).
    showAlert('✅ Code aapke email par bhej diya gaya hai.', 'success');
    btn.textContent = 'Verify page khul raha hai…';
    LW.go('otp.html?mode=signup&email=' + encodeURIComponent(email));
  } catch (e) {
    console.error('[Loveway] signup error:', e);
    showAlert('❌ ' + LW.errText(e), 'error');
    btn.disabled = false; btn.textContent = t('sendOtp');
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!LW.configOk) { showAlert('config.js me SUPABASE_ANON_KEY set nahi hai.', 'error'); return; }
  const session = await LW.getSession();
  if (session) {
    const p = await LW.getProfile();
    const next = LW.targetFor(p);
    LW.go(next === 'login.html' ? 'dashboard.html' : next);
  }
});
</script>
</body></html>
