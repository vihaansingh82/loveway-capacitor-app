<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Loveway</title>
<link rel="stylesheet" href="lw-tailwind.css?v=6">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lw-core.js?v=3"></script>
<script src="lw-app.js?v=6"></script>
</head>
<body data-theme="ocean">

<header>
  <h1>💕 Loveway</h1>
  <div class="header-tools">
    <a class="header-action" href="dashboard.html" data-icon="home" title="Home"></a>
    <a class="header-action" href="journey.html" data-icon="chain" title="Life Chain"></a>
    <a class="header-action" href="family.html" data-icon="tree" title="Family"></a>
    <a class="header-action" href="settings.html" data-icon="settings" title="Settings"></a>
    <button class="header-action" onclick="LW.logout()" data-icon="logout" title="Log out"></button>
  </div>
</header>

<div class="container">
  <div id="alertBox" class="alert"></div>

  <!-- ===== Profile header ===== -->
  <div class="card">
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <div style="position:relative">
        <div id="bigAv"></div>
        <button id="avatarEditBtn" onclick="document.getElementById('avatarFile').click()" title="Photo badlo" data-i18n-title="changePhotoTitle"
          style="display:none;position:absolute;bottom:-2px;right:-2px;width:28px;height:28px;border-radius:50%;
          background:var(--grad);color:#fff;border:2px solid var(--card);cursor:pointer;font-size:.85rem;
          padding:0;line-height:1">📷</button>
      </div>
      <input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="onAvatarPicked(event)">
      <div style="flex:1;min-width:180px">
        <h2 id="pName" style="font-size:1.3rem">—</h2>
        <div class="muted" id="pMeta">—</div>
        <div id="pRel" class="muted" style="margin-top:4px"></div>
      </div>
      <div id="ownerActions"></div>
    </div>
    <div class="stats">
      <div><b id="stFriends">0</b><span data-i18n="statFriends">Dost</span></div>
      <div><b id="stPosts">0</b><span data-i18n="statPosts">Posts</span></div>
      <div><b id="stStreak">0</b><span data-i18n="statStreak">Chain 🔥</span></div>
      <div><b id="stFamily">0</b><span data-i18n="statFamily">Family</span></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('about',this)" data-i18n="profileTab">Profile</div>
    <div class="tab"        onclick="showTab('timeline',this)" data-i18n="timelineTab">📜 Timeline</div>
    <div class="tab"        onclick="showTab('posts',this)" data-i18n="postsTab">📝 Posts</div>
    <div class="tab" id="editTab" style="display:none" onclick="showTab('edit',this)" data-i18n="editTab">✏️ Edit</div>
  </div>

  <!-- ===== About ===== -->
  <div id="tab-about">
    <div class="grid-2">
      <div>
        <div class="card">
          <h3 data-i18n="detailsHeading">👤 Details</h3>
          <div id="details" class="muted"></div>
        </div>
        <div class="card">
          <h3 data-i18n="storyHeading">📖 Meri kahani</h3>
          <div id="story" class="muted" style="white-space:pre-wrap"></div>
        </div>
      </div>
      <div>
        <div class="card">
          <h3 data-i18n="hobbiesHeading">✨ Hobbies</h3>
          <div id="hobbies"></div>
        </div>
        <div class="card" id="pinnedSongCard" style="display:none">
          <h3>🎵 Pinned Song</h3>
          <div id="pinnedSongBody"></div>
        </div>
        <div class="card">
          <h3 data-i18n="favsHeading">⭐ Favourites</h3>
          <div id="favs" class="muted"></div>
        </div>
        <div class="card" id="badgeCard" style="display:none">
          <h3 data-i18n="badgesHeading">🏅 Badges</h3>
          <div class="badge-row" id="badgeRow"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Timeline ===== -->
  <div id="tab-timeline" style="display:none">
    <div class="card">
      <h3 data-i18n="currentTimelineHeading">📜 Current Timeline</h3>
      <div id="timeline"><div class="spinner" data-i18n="loading">Load ho raha hai…</div></div>
    </div>
  </div>

  <!-- ===== Posts ===== -->
  <div id="tab-posts" style="display:none">
    <div class="card" id="myPosts"><div class="spinner" data-i18n="loading">Load ho raha hai…</div></div>
  </div>

  <!-- ===== Edit ===== -->
  <div id="tab-edit" style="display:none">
    <div class="card">
      <h3 data-i18n="editProfileHeading">✏️ Profile edit karo</h3>

      <div class="row-2">
        <div><label class="fl" data-i18n="fullNameFieldLabel">Poora naam</label><input type="text" id="fName"></div>
        <div>
          <label class="fl" data-i18n="cityFieldLabel">Shehar</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="fCity" style="flex:1">
            <button type="button" class="btn" onclick="pickProfileLocation()" title="Map se chuno" data-i18n-title="pickFromMapTitle">🗺️</button>
          </div>
          <input type="hidden" id="fLat"><input type="hidden" id="fLng">
        </div>
      </div>
      <div class="row-2">
        <div><label class="fl" data-i18n="professionFieldLabel">Kya karte ho? (Profession)</label><input type="text" id="fProf" placeholder="Teacher, Business, Student…" data-i18n-placeholder="professionPh"></div>
        <div><label class="fl" data-i18n="pincodeFieldLabel">Pincode</label><input type="text" id="fPin"></div>
      </div>
      <div class="row-2">
        <div>
          <label class="fl" data-i18n="relationshipFieldLabel">Relationship status</label>
          <select id="fRel">
            <option value="" data-i18n="chooseOption">— chuno —</option>
            <option value="single" data-i18n="relSingle">Single</option>
            <option value="in_relationship" data-i18n="relInRelationship">In a relationship</option>
            <option value="engaged" data-i18n="relEngaged">Engaged</option>
            <option value="married" data-i18n="relMarried">Married</option>
            <option value="complicated" data-i18n="relComplicated">It's complicated</option>
            <option value="private" data-i18n="relPrivate">Batana nahi hai</option>
          </select>
        </div>
        <div>
          <label class="fl" data-i18n="partnerFieldLabel">Partner (username)</label>
          <input type="text" id="fPartner" placeholder="@username" data-i18n-placeholder="partnerUsernamePh">
          <small class="muted" id="partnerHint"></small>
        </div>
      </div>
      <div class="row-2">
        <div><label class="fl" data-i18n="dob">Janam din</label><input type="date" id="fDob"></div>
        <div>
          <label class="fl" data-i18n="profilePhotoFieldLabel">Profile photo</label>
          <input type="hidden" id="fAvatar">
          <button type="button" class="btn" onclick="document.getElementById('avatarFile').click()" data-i18n="changePhotoBtn">📷 Photo badlo</button>
        </div>
      </div>

      <label class="fl" data-i18n="bioFieldLabel">Bio (chhoti si line)</label>
      <input type="text" id="fBio" maxlength="160">

      <label class="fl" data-i18n="storyFieldLabel">Meri kahani</label>
      <textarea id="fStory" rows="5" placeholder="Apne baare mein likho…" data-i18n-placeholder="storyPh"></textarea>

      <label class="fl" data-i18n="hobbiesFieldLabel">Hobbies (comma se alag karo)</label>
      <input type="text" id="fHobbies" placeholder="Music, Travel, Cooking" data-i18n-placeholder="hobbiesPh">

      <label class="fl">🎵 Pinned Song</label>
      <div id="pinnedSongEditRow" class="row" style="align-items:center;gap:10px;margin-bottom:6px"></div>

      <label class="fl" data-i18n="favouritesFieldLabel">Favourites</label>
      <div class="row-2">
        <input type="text" id="fFavFood"  placeholder="Pasandida khana" data-i18n-placeholder="favFoodPh">
        <input type="text" id="fFavMovie" placeholder="Pasandida film" data-i18n-placeholder="favMoviePh">
      </div>
      <div class="row-2" style="margin-top:12px">
        <input type="text" id="fFavPlace" placeholder="Pasandida jagah" data-i18n-placeholder="favPlacePh">
      </div>

      <div style="margin-top:20px;display:flex;gap:10px">
        <button class="btn primary" id="saveBtn" onclick="save()" data-i18n="saveProfileBtn">Save karo</button>
        <button class="btn" onclick="showTab('about',document.querySelector('.tab'))" data-i18n="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
var me = null, viewing = null, isOwner = false;

function showTab(name, el) {
  ['about', 'timeline', 'posts', 'edit'].forEach(function (t) {
    document.getElementById('tab-' + t).style.display = (t === name) ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
  if (el) el.classList.add('active');
  if (name === 'timeline') loadTimeline();
  if (name === 'posts')    loadPosts();
}

var REL_KEY = {
  single: 'relSingle', in_relationship: 'relInRelationship', engaged: 'relEngaged',
  married: 'relMarried', complicated: 'relComplicated', private: 'relPrivate'
};
var DATE_LOCALE = { en: 'en-IN', hi: 'hi-IN', braj: 'hi-IN', raj: 'hi-IN', bho: 'hi-IN', hyd: 'hi-IN', mr: 'mr-IN', ta: 'ta-IN', te: 'te-IN', bn: 'bn-IN', pa: 'pa-IN', gu: 'gu-IN' };

function paint(p) {
  var locale = DATE_LOCALE[window.LW_CURRENT] || 'en-IN';
  document.getElementById('bigAv').innerHTML = LWApp.avatarHtml(p, 'lg');
  document.getElementById('pName').textContent = p.full_name || p.username || '—';
  document.getElementById('pMeta').textContent =
    '@' + (p.username || '—') + (p.city ? ' · 📍 ' + p.city : '') +
    (p.profession ? ' · 💼 ' + p.profession : '');

  var rel = '';
  if (p.relationship_status && p.relationship_status !== 'private') {
    rel = '💑 ' + (window.t(REL_KEY[p.relationship_status]) || p.relationship_status);
    if (p.partner_name) rel += ' — ' + p.partner_name;
  }
  document.getElementById('pRel').textContent = rel;

  var d = [];
  if (p.profession) d.push('💼 ' + LWApp.esc(p.profession));
  if (p.city)       d.push('📍 ' + LWApp.esc(p.city));
  if (p.dob)        d.push('🎂 ' + new Date(p.dob).toLocaleDateString(locale, { day: 'numeric', month: 'long' }));
  if (p.bio)        d.push('💬 ' + LWApp.esc(p.bio));
  if (p.created_at) d.push('📅 ' + window.t('joinedLabel') + ' ' + new Date(p.created_at).toLocaleDateString(locale, { month: 'long', year: 'numeric' }));
  document.getElementById('details').innerHTML = d.length ? d.join('<br>') : window.t('detailsEmptyMsg');

  document.getElementById('story').textContent = p.story || window.t('storyEmptyMsg');

  var h = p.hobbies || [];
  document.getElementById('hobbies').innerHTML = h.length
    ? h.map(function (x) { return '<span class="chip">' + LWApp.esc(x) + '</span>'; }).join('')
    : '<span class="muted">' + LWApp.esc(window.t('hobbiesEmptyMsg')) + '</span>';

  var f = p.favourites || {};
  var fl = [];
  // purana free-text f.song sirf tab dikhao jab tak naya structured pinned
  // song na chuna ho — dono ek saath dikhana confusing hota (same cheez do baar)
  if (f.song && !p.pinned_spotify_track_id) fl.push('🎵 ' + LWApp.esc(f.song));
  if (f.food)  fl.push('🍲 ' + LWApp.esc(f.food));
  if (f.movie) fl.push('🎬 ' + LWApp.esc(f.movie));
  if (f.place) fl.push('🏞️ ' + LWApp.esc(f.place));
  document.getElementById('favs').innerHTML = fl.length ? fl.join('<br>') : window.t('favsEmptyMsg');

  var pinCard = document.getElementById('pinnedSongCard');
  if (p.pinned_song_title) {
    pinCard.style.display = '';
    document.getElementById('pinnedSongBody').innerHTML =
      '<div class="song-card" style="cursor:pointer;margin-top:0" onclick="playPinnedSong()">' +
        '<span class="spin-ic" style="font-size:1.4rem">🎵</span>' +
        '<div style="min-width:0;flex:1"><b style="display:block">' + LWApp.esc(p.pinned_song_title) + '</b>' +
        '<small class="muted">' + LWApp.esc(p.pinned_song_artist || '') + '</small></div>' +
        '<span class="icon-btn" style="font-size:1.1rem">▶</span>' +
      '</div>';
  } else {
    pinCard.style.display = 'none';
  }
}

function playPinnedSong() {
  if (!viewing || !viewing.pinned_spotify_track_id) return;
  if (typeof playMusicTrack === 'function') {
    playMusicTrack({ id: viewing.pinned_spotify_track_id, title: viewing.pinned_song_title, artist: viewing.pinned_song_artist });
  } else if (viewing.pinned_song_url) {
    window.open(viewing.pinned_song_url, '_blank', 'noopener');
  }
}

function fillForm(p) {
  document.getElementById('fName').value    = p.full_name || '';
  document.getElementById('fCity').value    = p.city || '';
  document.getElementById('fLat').value     = p.latitude  != null ? p.latitude  : '';
  document.getElementById('fLng').value     = p.longitude != null ? p.longitude : '';
  document.getElementById('fProf').value    = p.profession || '';
  document.getElementById('fPin').value     = p.pincode || '';
  document.getElementById('fRel').value     = p.relationship_status || '';
  document.getElementById('fDob').value     = p.dob || '';
  document.getElementById('fAvatar').value  = p.avatar_url || '';
  document.getElementById('fBio').value     = p.bio || '';
  document.getElementById('fStory').value   = p.story || '';
  document.getElementById('fHobbies').value = (p.hobbies || []).join(', ');

  var f = p.favourites || {};
  document.getElementById('fFavFood').value  = f.food  || '';
  document.getElementById('fFavMovie').value = f.movie || '';
  document.getElementById('fFavPlace').value = f.place || '';
  renderPinnedSongEditRow(p);

  if (p.partner_name) {
    document.getElementById('fPartner').value = p.partner_name;
    document.getElementById('partnerHint').textContent = window.t('partnerLinkedHint');
  }
}

async function save() {
  var btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = window.t('savingMsg');

  var patch = {
    full_name:  document.getElementById('fName').value.trim() || null,
    city:       document.getElementById('fCity').value.trim() || null,
    latitude:   document.getElementById('fLat').value ? parseFloat(document.getElementById('fLat').value) : null,
    longitude:  document.getElementById('fLng').value ? parseFloat(document.getElementById('fLng').value) : null,
    profession: document.getElementById('fProf').value.trim() || null,
    pincode:    document.getElementById('fPin').value.trim() || null,
    relationship_status: document.getElementById('fRel').value || null,
    dob:        document.getElementById('fDob').value || null,
    avatar_url: document.getElementById('fAvatar').value.trim() || null,
    bio:        document.getElementById('fBio').value.trim() || null,
    story:      document.getElementById('fStory').value.trim() || null,
    hobbies:    document.getElementById('fHobbies').value.split(',')
                  .map(function (x) { return x.trim(); }).filter(Boolean),
    favourites: {
      // 'song' ab is form se collect nahi hota (pinned-song picker use hota hai),
      // lekin purana free-text pehle se hai to save karte time udaana nahi hai
      song:  (me.favourites || {}).song || '',
      food:  document.getElementById('fFavFood').value.trim(),
      movie: document.getElementById('fFavMovie').value.trim(),
      place: document.getElementById('fFavPlace').value.trim()
    }
  };

  // partner username -> id
  var pu = document.getElementById('fPartner').value.trim().replace(/^@/, '');
  if (pu) {
    var other = await LWApp.publicProfile(pu);
    if (!other) {
      LWApp.toast(window.t('userNotFoundPrefix') + ' "' + pu + '"', 'error');
      btn.disabled = false; btn.textContent = window.t('saveProfileBtn');
      return;
    }
    if (other.id === me.id) {
      LWApp.toast(window.t('cantBeOwnPartnerMsg'), 'error');
      btn.disabled = false; btn.textContent = window.t('saveProfileBtn');
      return;
    }
    patch.partner_id = other.id;
  } else {
    patch.partner_id = null;
  }

  var r = await LWApp.saveProfile(patch);
  btn.disabled = false; btn.textContent = window.t('saveProfileBtn');

  if (r.error) { LWApp.toast('❌ ' + LWApp.err(r.error), 'error'); return; }

  LWApp.toast(window.t('profileSavedMsg'));
  me = Object.assign(me, patch);
  LW.profile = me;
  await hydratePartner(me);
  paint(me);
  showTab('about', document.querySelector('.tab'));
}

function renderPinnedSongEditRow(p) {
  var row = document.getElementById('pinnedSongEditRow');
  if (p.pinned_song_title) {
    row.innerHTML =
      '<span class="chip" style="margin:0">🎵 ' + LWApp.esc(p.pinned_song_title) +
      (p.pinned_song_artist ? ' — ' + LWApp.esc(p.pinned_song_artist) : '') + '</span>' +
      '<button type="button" class="btn sm" onclick="pickProfilePinnedSong()">🔄 Badlo</button>' +
      '<button type="button" class="btn sm danger" onclick="removeProfilePinnedSong()">✕ Hatao</button>';
  } else {
    row.innerHTML = '<button type="button" class="btn sm primary" onclick="pickProfilePinnedSong()">🎵 Gaana pin karo</button>';
  }
}

async function pickProfilePinnedSong() {
  LWApp.openSpotifyPicker(async function (track) {
    try {
      await LWApp.updateProfilePinnedSong(track);
      me.pinned_spotify_track_id = track.id;
      me.pinned_song_title = track.title;
      me.pinned_song_artist = track.artist || null;
      me.pinned_song_url = track.url || null;
      LW.profile = me;
      renderPinnedSongEditRow(me);
      if (viewing === me) paint(me);
      LWApp.toast('🎵 Song pin ho gaya');
    } catch (e) {
      LWApp.toast('❌ ' + LWApp.err(e), 'error');
    }
  });
}

async function removeProfilePinnedSong() {
  try {
    await LWApp.updateProfilePinnedSong(null);
    me.pinned_spotify_track_id = null;
    me.pinned_song_title = null;
    me.pinned_song_artist = null;
    me.pinned_song_url = null;
    LW.profile = me;
    renderPinnedSongEditRow(me);
    if (viewing === me) paint(me);
    LWApp.toast('Pin hata diya');
  } catch (e) {
    LWApp.toast('❌ ' + LWApp.err(e), 'error');
  }
}

function pickProfileLocation() {
  LWApp.openLocationPicker(function (loc) {
    document.getElementById('fCity').value = loc.name;
    document.getElementById('fLat').value = loc.lat;
    document.getElementById('fLng').value = loc.lng;
  });
}

async function onAvatarPicked(e) {
  var file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (file.type.indexOf('image/') !== 0) { LWApp.toast(window.t('onlyImageErr'), 'error'); return; }
  if (file.size > 5 * 1024 * 1024) { LWApp.toast(window.t('avatarSizeErr'), 'error'); return; }

  LWApp.toast(window.t('uploadingPhotoMsg'));
  try {
    var url = await LWApp.uploadAvatar(file);
    var r = await LWApp.saveProfile({ avatar_url: url });
    if (r.error) { LWApp.toast('❌ ' + LWApp.err(r.error), 'error'); return; }
    me.avatar_url = url;
    LW.profile = me;
    document.getElementById('fAvatar').value = url;
    paint(me);
    LWApp.toast(window.t('avatarUpdatedMsg'));
  } catch (er) {
    LWApp.toast('❌ ' + LWApp.err(er), 'error');
  }
}

async function hydratePartner(p) {
  if (!p.partner_id) { p.partner_name = null; return; }
  var o = await LWApp.publicProfile(p.partner_id);
  p.partner_name = o ? (o.full_name || o.username) : null;
}

async function loadTimeline() {
  var el = document.getElementById('timeline');
  var rows = await LWApp.timeline(viewing.id, 40);
  var TIMELINE_ICONS = { post: '📝', friend: '🤝', gift: '🎁', goal: '🎯' };
  el.innerHTML = rows.length
    ? '<div class="journey-chain">' + rows.map(function (t) {
        var ic = TIMELINE_ICONS[t.kind] || '•';
        var important = t.kind === 'gift' || t.kind === 'goal';
        return '<div class="journey-node' + (important ? ' important' : '') + '">' +
          '<div class="journey-dot"></div>' +
          '<div class="journey-card">' +
            '<div class="journey-card-head"><div style="flex:1;min-width:0">' +
              '<b>' + ic + ' ' + LWApp.esc(t.title) + '</b>' +
              '<small>' + LWApp.timeAgo(t.created_at) + '</small>' +
            '</div></div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>'
    : '<div class="empty"><span class="ic">📜</span>' + LWApp.esc(window.t('timelineEmptyTitle')) + '<br>' + LWApp.esc(window.t('timelineEmptySub')) + '</div>';
}

async function loadPosts() {
  var el = document.getElementById('myPosts');
  var rows = await LWApp.feed({ authorId: viewing.id, limit: 40 });
  el.innerHTML = rows.length
    ? rows.map(function (p) {
        return '<div class="post"><div class="post-head">' + LWApp.avatarHtml(p.author, 'sm') +
               '<div><b>' + LWApp.esc(p.author.full_name || '—') + '</b><small>' +
               LWApp.timeAgo(p.created_at) + '</small></div></div>' +
               (p.content ? '<div class="post-body">' + LWApp.esc(p.content) + '</div>' : '') +
               '<div class="post-actions"><span>❤️ ' + p.love_count +
               '</span><span>💬 ' + p.comment_count + '</span></div></div>';
      }).join('')
    : '<div class="empty"><span class="ic">📝</span>' + LWApp.esc(window.t('noPostsMsg')) + '</div>';
}

async function loadStats() {
  if (isOwner) {
    var f = await LWApp.myFriends();
    document.getElementById('stFriends').textContent = f.length;
    var s = await LWApp.myStreak();
    document.getElementById('stStreak').textContent = s.current_count || 0;
  }
  var p = await LWApp.feed({ authorId: viewing.id, limit: 100 });
  document.getElementById('stPosts').textContent = p.length;
  var fam = await LWApp.familyTree(viewing.id);
  document.getElementById('stFamily').textContent = fam.length;
}

document.addEventListener('DOMContentLoaded', async function () {
  if (!LW.configOk) { LWApp.toast('config.js me Supabase keys daalo.', 'error'); return; }
  me = await LW.requireAuth();
  if (!me) return;
  LWApp.shell('profile');

  var who = new URLSearchParams(location.search).get('u');
  if (who && who !== me.username) {
    viewing = await LWApp.publicProfile(who);
    if (!viewing) { LWApp.toast(window.t('noProfile'), 'error'); viewing = me; isOwner = true; }
  } else {
    viewing = me; isOwner = true;
  }

  await hydratePartner(viewing);
  paint(viewing);

  if (isOwner) {
    document.getElementById('editTab').style.display = '';
    document.getElementById('avatarEditBtn').style.display = '';
    document.getElementById('ownerActions').innerHTML =
      '<a class="btn" href="family.html" data-i18n="familyLinkBtn">🌳 Family</a> ' +
      '<a class="btn" href="friends.html" data-i18n="friendsLinkBtn">👥 Dost</a>';
    fillForm(viewing);
  } else {
    var myFriends = await LWApp.myFriends();
    var already = myFriends.some(function (f) { return f.id === viewing.id; });
    document.getElementById('ownerActions').innerHTML =
      '<button class="btn primary" onclick="msgThem()" data-i18n="messageBtn">💬 Message</button>' +
      (already ? '' : ' <a class="btn" href="add-friend.html?u=' + encodeURIComponent(viewing.username || '') +
        '" data-i18n="addFriendBtn">➕ Friend request bhejo</a>');
  }

  if (typeof window.applyLanguage === 'function') window.applyLanguage();
  await loadStats();
  loadBadges();
});

function loadBadges() {
  var friendsN = parseInt(document.getElementById('stFriends').textContent, 10) || 0;
  var postsN   = parseInt(document.getElementById('stPosts').textContent, 10) || 0;
  var streakN  = parseInt(document.getElementById('stStreak').textContent, 10) || 0;
  var badges = [];
  if (streakN >= 7)   badges.push({ ic: '🔥', label: window.t('badge7DayStreak'), gold: true });
  if (streakN >= 30)  badges.push({ ic: '🏆', label: window.t('badge30DayStreak'), gold: true });
  if (friendsN >= 10) badges.push({ ic: '👥', label: window.t('badge10Friends') });
  if (postsN >= 20)   badges.push({ ic: '📝', label: window.t('badge20Posts') });
  if (viewing.partner_id) badges.push({ ic: '💑', label: window.t('badgeCommitted') });

  var card = document.getElementById('badgeCard');
  var row  = document.getElementById('badgeRow');
  if (badges.length) {
    card.style.display = '';
    row.innerHTML = badges.map(function (b) {
      return '<span class="badge-pill' + (b.gold ? ' gold' : '') + '">' + b.ic + ' ' + LWApp.esc(b.label) + '</span>';
    }).join('');
  }
}

async function msgThem() {
  try {
    var cid = await LWApp.openDirect(viewing.id);
    window.location.href = 'messages.html?c=' + cid;
  } catch (e) {
    LWApp.toast('❌ ' + LWApp.err(e), 'error');
  }
}

document.addEventListener('lw:language', function () {
  if (!viewing) return;
  paint(viewing);
  loadBadges();
  var activeTab = document.querySelector('.tab.active');
  var name = activeTab && activeTab.getAttribute('onclick') || '';
  if (name.indexOf("'timeline'") !== -1) loadTimeline();
  if (name.indexOf("'posts'") !== -1) loadPosts();
});
</script>
</body>
