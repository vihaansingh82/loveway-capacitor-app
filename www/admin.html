<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loveway — Admin</title>
<link rel="stylesheet" href="lw-tailwind.css?v=4">
<style>
/* Page-local, loaded after lw-tailwind.css so it wins cascade on this page —
   admin.html has its own bespoke panel/table design (renamed .btn/.tab/
   .badge/.alert/.empty/.muted would otherwise collide with the shared
   app-shell components of the same name). Variable names unified onto the
   canonical --primary/--bg/... tokens (Phase 2), values unchanged. */

  body{padding:30px 20px 60px}
  h1{font-family:var(--font-display);font-size:1.6rem}
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
  .btn{padding:9px 20px;border-radius:50px;border:1px solid rgba(255,79,123,0.5);color:var(--primary);background:transparent;font-size:.85rem;cursor:pointer;transition:all .3s}
  .btn:hover{background:rgba(255,79,123,0.1)}
  .btn-approve{background:rgba(76,175,80,0.15);border:1px solid rgba(76,175,80,0.4);color:#81c784;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:.8rem;margin-right:6px}
  .btn-reject{background:rgba(255,79,79,0.15);border:1px solid rgba(255,79,79,0.4);color:#ff8080;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:.8rem}
  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .tab{padding:8px 18px;border-radius:50px;font-size:.85rem;cursor:pointer;background:var(--bg2);color:var(--text-soft);border:1px solid rgba(255,79,123,0.15)}
  .tab.active{background:var(--primary);color:#fff}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden}
  th,td{padding:12px 14px;text-align:left;font-size:.85rem;border-bottom:1px solid rgba(255,79,123,0.1)}
  th{color:var(--primary);text-transform:uppercase;font-size:.72rem;letter-spacing:.05em}
  tr:last-child td{border-bottom:none}
  .muted{color:var(--text-soft)}
  .badge{padding:4px 10px;border-radius:50px;font-size:.72rem}
  .badge.pending{background:rgba(255,179,71,0.15);color:var(--accent)}
  .badge.approved{background:rgba(76,175,80,0.15);color:#81c784}
  .badge.rejected{background:rgba(255,79,79,0.15);color:#ff8080}
  .empty{text-align:center;padding:50px;color:var(--text-soft)}
  #loginGate{max-width:380px;margin:80px auto;background:var(--card);border:1px solid rgba(255,79,123,0.2);border-radius:20px;padding:36px;text-align:center}
  #loginGate a{color:var(--primary)}

  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 10%,rgba(255,79,123,.16),transparent 30%),radial-gradient(circle at 90% 80%,rgba(255,179,71,.08),transparent 28%);z-index:-1}
  .wrap{position:relative;z-index:1}
  header{padding:20px 22px;border:1px solid rgba(255,255,255,.07);border-radius:24px;background:linear-gradient(135deg,rgba(61,30,48,.88),rgba(45,21,37,.72));backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.28)}
  .brand-area{display:flex;align-items:center;gap:14px}
  .admin-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,var(--primary),#ff9aaf);box-shadow:0 10px 30px rgba(255,79,123,.3)}
  .brand-copy small{display:block;color:var(--pink-light);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
  h1{font-size:clamp(1.35rem,3vw,1.8rem)}
  .header-actions{display:flex;align-items:center;gap:10px}
  .btn{background:rgba(255,255,255,.035);backdrop-filter:blur(8px)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,79,123,.12)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
  .stat-card{position:relative;overflow:hidden;padding:18px 20px;border-radius:18px;background:rgba(45,21,37,.72);border:1px solid rgba(255,255,255,.06);box-shadow:0 12px 35px rgba(0,0,0,.16)}
  .stat-card::after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-30px;top:-30px;background:rgba(255,79,123,.08)}
  .stat-label{font-size:.72rem;color:var(--text-soft);text-transform:uppercase;letter-spacing:.08em}
  .stat-value{font-family:var(--font-display);font-size:1.65rem;margin-top:5px}
  .stat-card.total-card .stat-value{color:var(--accent)}
  .stat-card.approved-card .stat-value{color:#81c784}
  .stat-card.rejected-card .stat-value{color:#ff8080}
  .panel{background:rgba(45,21,37,.62);border:1px solid rgba(255,255,255,.06);border-radius:22px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.22);backdrop-filter:blur(16px)}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar-title{font-weight:500;font-size:.95rem}
  .search{width:min(280px,100%);padding:10px 14px 10px 38px;border-radius:12px;border:1px solid rgba(255,79,123,.16);background:rgba(26,10,20,.55);color:var(--text);outline:none;position:relative}
  .search:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,79,123,.08)}
  .search-wrap{position:relative}
  .search-icon{position:absolute;left:13px;top:9px;z-index:2;opacity:.6}
  .tabs{padding:5px;background:rgba(26,10,20,.38);border:1px solid rgba(255,255,255,.05);border-radius:16px;width:max-content;max-width:100%}
  .tab{border-color:transparent;padding:9px 16px;transition:.25s}
  .tab:hover{color:var(--text);transform:translateY(-1px)}
  .tab.active{box-shadow:0 7px 20px rgba(255,79,123,.25)}
  .table-scroll{overflow:auto;border-radius:16px}
  table{min-width:900px;background:rgba(26,10,20,.45)}
  th{background:rgba(255,79,123,.055);padding-top:14px;padding-bottom:14px}
  td{padding-top:14px;padding-bottom:14px}
  tbody tr{transition:.2s;background:transparent}
  tbody tr:hover{background:rgba(255,79,123,.055)}
  .user-name{font-weight:500;color:var(--text)}
  .username-pill{display:inline-block;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.045)}
  .btn-approve,.btn-reject{transition:.2s}
  .btn-approve:hover,.btn-reject:hover{transform:translateY(-1px);filter:brightness(1.15)}
  .empty{padding:70px 20px}
  .empty-icon{font-size:34px;display:block;margin-bottom:10px;opacity:.7}
  #loginGate{background:linear-gradient(145deg,rgba(61,30,48,.9),rgba(45,21,37,.8));box-shadow:0 25px 70px rgba(0,0,0,.3)}
  @media(max-width:760px){.stats{grid-template-columns:1fr}.header-actions{width:100%;justify-content:flex-end}.toolbar{align-items:stretch}.search-wrap,.search{width:100%}body{padding:20px 12px 50px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lw-core.js?v=3"></script>
</head>
<body>
<div class="lang-switcher" aria-label="Language selector">
  <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
  <button class="lang-btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
  <button class="lang-btn" data-lang="braj" onclick="setLanguage('braj')">ब्रज</button>
  <button class="lang-btn" data-lang="raj" onclick="setLanguage('raj')">राजस्थानी</button>
  <button class="lang-btn" data-lang="bho" onclick="setLanguage('bho')">भोजपुरी</button>
  <button class="lang-btn" data-lang="hyd" onclick="setLanguage('hyd')">हैदराबादी</button>
  <button class="lang-btn" data-lang="mr" onclick="setLanguage('mr')">मराठी</button>
</div>

<div class="wrap" id="app" style="display:none;">
  <header>
    <div class="brand-area">
      <div class="admin-icon">🛡️</div>
      <div class="brand-copy">
        <small>Loveway Control Center</small>
        <h1 data-i18n="adminTitle"></h1>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="loadUsers()">↻ <span data-i18n="refresh"></span></button>
      <button class="btn" onclick="logout()">↪ <span data-i18n="logout"></span></button>
    </div>
  </header>
  <div id="alertBox" class="alert"></div>
  <div class="stats">
    <div class="stat-card total-card"><div class="stat-label" data-i18n="all"></div><div class="stat-value" id="totalCount">—</div></div>
    <div class="stat-card approved-card"><div class="stat-label" data-i18n="approved"></div><div class="stat-value" id="approvedCount">—</div></div>
    <div class="stat-card rejected-card"><div class="stat-label" data-i18n="rejected"></div><div class="stat-value" id="rejectedCount">—</div></div>
  </div>
  <div class="panel">
    <div class="toolbar">
      <div class="toolbar-title">👥 <span data-i18n="userManagement"></span></div>
      <div class="search-wrap"><span class="search-icon">⌕</span><input id="userSearch" class="search" type="search" data-i18n-placeholder="searchUsers" oninput="filterUsers()"></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-status="all" onclick="switchTab('all')" data-i18n="all"></div>
      <div class="tab" data-status="approved" onclick="switchTab('approved')" data-i18n="approved"></div>
      <div class="tab" data-status="rejected" onclick="switchTab('rejected')" data-i18n="rejected"></div>
    </div>
    <div id="tableWrap"><div class="empty" data-i18n="loading"></div></div>
  </div>
</div>

<div id="loginGate">
  <p><span data-i18n="adminGate"></span> <a href="login.html" data-i18n="loginFirst"></a>.</p>
</div>


<script>
/* Admin — seedha profiles table se (RLS admin ko sab dikhata hai).
   Koi edge function nahi. */
let currentStatus = 'all';
let allRows = [];

const showAlert = (msg, type) => {
  LW.alert(msg, type);
  setTimeout(() => LW.hideAlert(), 4000);
};

const escapeHtml = LW.escapeHtml;

function renderTable(rows) {
  const wrap = document.getElementById('tableWrap');
  if (!rows.length) {
    wrap.innerHTML = '<div class="empty"><span class="empty-icon">🌸</span>' + t('noUsers') + '</div>';
    return;
  }
  let html = '<div class="table-scroll"><table><thead><tr>' +
    ['name', 'usernameCol', 'email', 'mobileCol', 'genderCol', 'dobCol', 'status', 'joined', 'action']
      .map(k => '<th>' + t(k) + '</th>').join('') +
    '</tr></thead><tbody>';

  const loc = LW_CURRENT === 'mr' ? 'mr-IN' : (LW_CURRENT === 'en' ? 'en-IN' : 'hi-IN');

  rows.forEach(u => {
    html += '<tr>' +
      '<td><span class="user-name">' + escapeHtml(u.full_name || '—') + '</span></td>' +
      '<td class="muted"><span class="username-pill">@' + escapeHtml(u.username || '—') + '</span></td>' +
      '<td class="muted">' + escapeHtml(u.email || '—') + '</td>' +
      '<td>' + escapeHtml(u.mobile || '—') + '</td>' +
      '<td class="muted">' + escapeHtml(u.gender || '—') + '</td>' +
      '<td class="muted">' + (u.dob || '—') + '</td>' +
      '<td><span class="badge ' + u.status + '">' + t(u.status) + '</span></td>' +
      '<td class="muted">' + new Date(u.created_at).toLocaleDateString(loc) + '</td>' +
      '<td>' +
        (u.status !== 'approved' ? '<button class="btn-approve" onclick="act(\'' + u.id + '\',\'approved\')">' + t('approve') + '</button>' : '') +
        (u.status !== 'rejected' ? '<button class="btn-reject" onclick="act(\'' + u.id + '\',\'rejected\')">' + t('reject') + '</button>' : '') +
      '</td>' +
    '</tr>';
  });
  wrap.innerHTML = html + '</tbody></table></div>';
}

function updateStats(rows) {
  const c = { approved: 0, rejected: 0 };
  rows.forEach(u => { if (c[u.status] !== undefined) c[u.status]++; });
  document.getElementById('totalCount').textContent    = rows.length;
  document.getElementById('approvedCount').textContent = c.approved;
  document.getElementById('rejectedCount').textContent = c.rejected;
}

function visibleRows() {
  const q = (document.getElementById('userSearch').value || '').trim().toLowerCase();
  return allRows
    .filter(u => currentStatus === 'all' || u.status === currentStatus)
    .filter(u => !q || [u.full_name, u.username, u.email, u.mobile, u.gender, u.dob, u.status]
      .some(v => String(v || '').toLowerCase().includes(q)));
}

function filterUsers() { renderTable(visibleRows()); }

function switchTab(status) {
  currentStatus = status;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.status === status));
  renderTable(visibleRows());
}

async function loadUsers() {
  document.getElementById('tableWrap').innerHTML = '<div class="empty">' + t('loading') + '</div>';
  const { data, error } = await LW.sb
    .from('profiles')
    .select('id, full_name, username, email, mobile, gender, dob, status, is_admin, created_at')
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('tableWrap').innerHTML =
      '<div class="empty"><span class="empty-icon">⚠️</span>' + t('loadFail') + '</div>';
    return;
  }
  allRows = data || [];
  updateStats(allRows);
  renderTable(visibleRows());
}

/* approve / reject */
async function act(userId, status) {
  const { error } = await LW.sb.from('profiles').update({ status: status }).eq('id', userId);
  if (error) { showAlert('❌ ' + LW.errText(error), 'error'); return; }
  showAlert('✅ ' + t(status), 'success');
  const row = allRows.find(u => u.id === userId);
  if (row) row.status = status;
  updateStats(allRows);
  renderTable(visibleRows());
}

function loadUsersDirect() { loadUsers(); }
function logout() { LW.logout(); }

document.addEventListener('DOMContentLoaded', async () => {
  if (!LW.configOk) {
    document.getElementById('loginGate').style.display = 'block';
    return;
  }
  const p = await LW.getProfile();
  if (!p || !p.is_admin) {
    document.getElementById('loginGate').style.display = 'block';
    return;
  }
  document.getElementById('app').style.display = 'block';
  switchTab('all');
  loadUsers();
});
</script>
</body>
</html>
