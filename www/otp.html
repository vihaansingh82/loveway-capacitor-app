<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loveway — OTP</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>

/* Language switcher */
.lang-switcher{position:fixed;top:18px;right:22px;z-index:9999;display:flex;gap:5px;padding:5px;background:rgba(45,21,37,.88);border:1px solid rgba(255,79,123,.25);border-radius:50px;backdrop-filter:blur(12px);box-shadow:0 8px 25px rgba(0,0,0,.18)}
.lang-btn{border:0;background:transparent;color:var(--text-muted);padding:7px 10px;border-radius:30px;font:500 .72rem 'DM Sans',sans-serif;cursor:pointer;transition:.25s}
.lang-btn:hover{color:var(--white)}
.lang-btn.active{background:var(--pink);color:#fff;box-shadow:0 3px 10px rgba(255,79,123,.3)}
@media(max-width:600px){.lang-switcher{top:10px;right:10px}.lang-btn{padding:6px 8px;font-size:.68rem}}

  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{--pink:#FF4F7B;--pink-light:#FF85A1;--dark:#1A0A14;--dark2:#2D1525;--dark3:#3D1E30;--gold:#FFB347;--white:#FFF5F8;--text-muted:#C4849A;}
  body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden;}
  .auth-bg{position:fixed;inset:0;background-image:url("auth-bg.jpg");background-size:cover;background-position:center;}
  .auth-bg-overlay{position:fixed;inset:0;background:rgba(26,10,20,0.82);backdrop-filter:blur(2px);}
  .auth-card{background:rgba(45,21,37,0.97);border:1px solid rgba(255,79,123,0.2);border-radius:28px;padding:44px;max-width:400px;width:100%;position:relative;z-index:2;box-shadow:0 40px 80px rgba(0,0,0,0.5);text-align:center;}
  .auth-logo img{height:68px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(255,79,123,0.35));margin-bottom:16px;}
  .phone-icon{font-size:3.5rem;margin-bottom:12px;}
  .auth-title{font-family:'Playfair Display',serif;font-size:1.7rem;margin-bottom:8px;}
  .auth-sub{font-size:.875rem;color:var(--text-muted);margin-bottom:28px;line-height:1.6;}
  .otp-boxes{display:flex;gap:10px;justify-content:center;margin-bottom:20px;}
  .otp-box{width:52px;height:60px;background:var(--dark3);border:1.5px solid rgba(255,79,123,0.25);border-radius:12px;font-size:1.6rem;font-weight:700;color:var(--pink);text-align:center;outline:none;caret-color:var(--pink);transition:border .2s;}
  .otp-box:focus{border-color:var(--pink);background:rgba(255,79,123,0.08);}
  .timer{font-size:.9rem;color:var(--text-muted);margin-bottom:22px;}
  .timer span{color:var(--pink);font-weight:600;}
  .auth-btn{width:100%;padding:14px;border-radius:12px;background:var(--pink);color:#fff;border:none;font-size:1rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .3s;box-shadow:0 8px 24px rgba(255,79,123,0.3);}
  .auth-btn:hover:not(:disabled){background:#e03565;}
  .auth-btn:disabled{opacity:.6;cursor:not-allowed;}
  .resend{margin-top:16px;font-size:.875rem;color:var(--text-muted);}
  .resend a{color:var(--pink);text-decoration:none;cursor:pointer;}
  .resend a.disabled{opacity:.4;pointer-events:none;}
  .alert{padding:12px 16px;border-radius:10px;margin-bottom:14px;font-size:.875rem;display:none;}
  .alert.error{background:rgba(255,79,79,0.15);border:1px solid rgba(255,79,79,0.3);color:#ff8080;}
  .alert.success{background:rgba(76,175,80,0.15);border:1px solid rgba(76,175,80,0.3);color:#81c784;}

  /* 7 bhaashaayein — chhoti screen par pill swipe hoti hai, katati nahi */
  .lang-switcher{max-width:calc(100vw - 36px);flex-wrap:nowrap;overflow-x:auto;
    scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
  .lang-switcher::-webkit-scrollbar{display:none}
  .lang-btn{flex:0 0 auto;white-space:nowrap}
  @media(max-width:560px){
    .lang-switcher{left:10px;right:10px;max-width:none;justify-content:flex-start}
    .lang-btn{padding:6px 9px;font-size:.66rem}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lw-core.js?v=2"></script>
</head>
<body>
<div class="lang-switcher" aria-label="Language selector">
  <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
  <button class="lang-btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
  <button class="lang-btn" data-lang="braj" onclick="setLanguage('braj')">ब्रज</button>
  <button class="lang-btn" data-lang="raj" onclick="setLanguage('raj')">राजस्थानी</button>
  <button class="lang-btn" data-lang="bho" onclick="setLanguage('bho')">भोजपुरी</button>
  <button class="lang-btn" data-lang="hyd" onclick="setLanguage('hyd')">हैदराबादी</button>
  <button class="lang-btn" data-lang="mr" onclick="setLanguage('mr')">मराठी</button>
</div>

<div class="auth-bg"></div>
<div class="auth-bg-overlay"></div>
<div class="auth-card">
  <div class="auth-logo"><img src="logo.png" alt="Loveway"></div>
  <div class="phone-icon">📱</div>
  <div class="auth-title" data-i18n="verifyTitle"></div>
  <div class="auth-sub" id="subtitle" data-i18n="verifySub"></div>

  <div id="alertBox" class="alert"></div>

  <div class="otp-boxes">
    <input class="otp-box" maxlength="1" type="text" inputmode="numeric" id="o1">
    <input class="otp-box" maxlength="1" type="text" inputmode="numeric" id="o2">
    <input class="otp-box" maxlength="1" type="text" inputmode="numeric" id="o3">
    <input class="otp-box" maxlength="1" type="text" inputmode="numeric" id="o4">
    <input class="otp-box" maxlength="1" type="text" inputmode="numeric" id="o5">
    <input class="otp-box" maxlength="1" type="text" inputmode="numeric" id="o6">
  </div>

  <div class="timer"><span data-i18n="resendIn"></span> <span id="countdown">05:00</span></div>

  <button class="auth-btn" id="verifyBtn" onclick="doVerify()" data-i18n="verify"></button>
  <div class="resend"><span data-i18n="noOtp"></span> <a id="resendLink" class="disabled" onclick="doResend()" data-i18n="resend"></a></div>
</div>


<script>
/* Verify — Supabase OTP.
   Default: email par 6-digit code (free).
   config.js me OTP_CHANNEL:'sms' karo to phone OTP (pehle
   Supabase me SMS provider set karna padega). */
const params  = new URLSearchParams(window.location.search);
const channel = (LW.cfg.OTP_CHANNEL === 'sms') ? 'sms' : 'email';
// mode=signup  -> signup ne abhi hi mail bheja hai, dobara na bhejo
const isSignup = params.get('mode') === 'signup';
let email  = (params.get('email') || '').trim();
let mobile = LW.normalizeMobile(params.get('mobile') || '');
let sent   = false;
let seconds = 300;
let timer = null;

const showAlert = (msg, type) => LW.alert(msg, type);

function target() { return channel === 'sms' ? mobile : email; }

async function sendOtp() {
  if (!target()) {
    showAlert(channel === 'sms' ? t('mobile') + ' ?' : t('emailRequired'), 'error');
    return false;
  }
  let error;
  if (channel === 'sms') {
    ({ error } = await LW.sb.auth.signInWithOtp({ phone: mobile }));
  } else if (isSignup) {
    // naye account ka confirmation mail dobara bhejo (type: signup)
    ({ error } = await LW.resendSignupOtp(email));
  } else {
    // pehle se confirmed user ke liye login OTP
    ({ error } = await LW.sb.auth.signInWithOtp({
      email: email,
      options: { shouldCreateUser: false, emailRedirectTo: LW.pageUrl('callback.html') }
    }));
  }
  if (error) {
    const msg = LW.errText(error);
    // Supabase ka 60-second rate limit — ye asli error nahi hai,
    // pehla mail already ja chuka hai.
    if (/security purposes|rate limit|after \d+ seconds/i.test(msg)) {
      showAlert(t('otpAlreadySentMsg'), 'success');
      sent = true;
      startTimer();
      return true;
    }
    showAlert(t('otpSendFail') + ' ' + msg, 'error');
    return false;
  }
  sent = true;
  document.getElementById('subtitle').textContent = t('otpSent') + ' ' + target();
  startTimer();
  return true;
}

function startTimer() {
  seconds = 300;
  if (timer) clearInterval(timer);
  const el = document.getElementById('countdown');
  const link = document.getElementById('resendLink');
  link.classList.add('disabled');
  timer = setInterval(() => {
    seconds--;
    el.textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
    if (seconds <= 0) {
      clearInterval(timer);
      el.textContent = '00:00';
      link.classList.remove('disabled');
    }
  }, 1000);
}

/* OTP boxes: auto-focus, backspace, paste */
document.querySelectorAll('.otp-box').forEach((box, i, all) => {
  box.addEventListener('input', e => {
    const v = e.target.value.replace(/\D/g, '');
    e.target.value = v;
    if (v && i < 5) all[i + 1].focus();
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !box.value && i > 0) all[i - 1].focus();
    if (e.key === 'Enter') doVerify();
  });
  box.addEventListener('paste', e => {
    const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
    [...pasted].forEach((ch, j) => { if (all[j]) all[j].value = ch; });
    const next = Math.min(pasted.length, 5);
    if (all[next]) all[next].focus();
    e.preventDefault();
  });
});

function getOtp() {
  return ['o1', 'o2', 'o3', 'o4', 'o5', 'o6'].map(id => document.getElementById(id).value).join('');
}

async function doVerify() {
  const otp = getOtp();
  if (otp.length !== 6) { showAlert(t('otpComplete'), 'error'); return; }
  if (!sent)            { showAlert(t('otpExpired'), 'error'); return; }

  const btn = document.getElementById('verifyBtn');
  btn.disabled = true; btn.textContent = t('verifying');
  LW.hideAlert();

  let error;
  if (channel === 'sms') {
    ({ error } = await LW.sb.auth.verifyOtp({ phone: mobile, token: otp, type: 'sms' }));
  } else {
    // signup / email / magiclink — teeno type try hote hain
    ({ error } = await LW.verifyEmailOtp(email, otp));
  }

  if (error) {
    showAlert('❌ ' + t('wrongOtp') + ' (' + LW.errText(error) + ')', 'error');
    btn.disabled = false; btn.textContent = t('verify');
    return;
  }

  showAlert('✅ ' + t('codeVerified'), 'success');
  btn.textContent = t('openingDashboardMsg');

  let next = 'dashboard.html';
  try {
    const p = await LW.getProfile();
    if (p) next = LW.targetFor(p);
  } catch (e) {
    console.warn('[Loveway] profile fetch fail:', e);
  }
  if (next === 'login.html') next = 'dashboard.html';   // loop se bacho
  LW.go(next);
}

async function doResend() {
  const link = document.getElementById('resendLink');
  if (link.classList.contains('disabled')) return;
  link.classList.add('disabled');
  if (await sendOtp()) showAlert(t('newOtp'), 'success');
  else link.classList.remove('disabled');
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!LW.configOk) { showAlert('config.js me SUPABASE_ANON_KEY set nahi hai.', 'error'); return; }
  document.getElementById('subtitle').textContent =
    channel === 'sms' ? t('verifySub') : t('otpEmailSub');

  // params na hon to logged-in user se le lo
  if (!target()) {
    const u = await LW.getUser();
    if (u) { email = u.email || email; mobile = LW.normalizeMobile(u.phone || mobile); }
  }
  if (!target()) {
    showAlert(t('emailRequired') + ' — <a href="signup.html" style="color:var(--pink)">signup →</a>', 'error');
    return;
  }

  if (isSignup) {
    // Signup ne abhi hi mail bhej diya hai. Dobara bhejne se Supabase
    // ka rate limit lag jaata hai aur pehla code invalid ho jaata hai.
    sent = true;
    document.getElementById('subtitle').textContent =
      t('signupCodeSentPrefix') + email + t('signupCodeSentSuffix');
    startTimer();
  } else {
    await sendOtp();
  }

  const first = document.getElementById('o1');
  if (first) first.focus();
});
</script>
</body></html>
