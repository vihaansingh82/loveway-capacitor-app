<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loveway — Account blocked</title>
<link rel="stylesheet" href="lw-tailwind.css?v=5">
<style>
  .glow{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,rgba(255,79,123,.15),transparent 62%);pointer-events:none}
  .card{position:relative;width:100%;max-width:520px;background:var(--card);border:1px solid rgba(255,79,123,.16);border-radius:26px;padding:44px 38px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.45)}
  .stamp{width:78px;height:78px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.1rem;background:rgba(255,179,71,.12);border:1px solid rgba(255,179,71,.4)}
  .card.bad .stamp{background:rgba(255,79,123,.12);border-color:rgba(255,79,123,.45)}
  h1{font-family:var(--font-display);font-size:1.75rem;line-height:1.25;margin-bottom:12px}
  .sub{color:var(--text-soft);font-size:.95rem;line-height:1.65;margin-bottom:26px}
  .track{display:flex;align-items:center;gap:0;margin:0 auto 28px;max-width:400px}
  .node{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
  .dot{width:15px;height:15px;border-radius:50%;background:var(--bg2);border:2px solid rgba(255,79,123,.3)}
  .node.done .dot{background:var(--primary);border-color:var(--primary)}
  .node.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 6px rgba(255,179,71,.14)}
  .node small{font-size:.7rem;color:var(--text-soft);letter-spacing:.03em}
  .node.done small,.node.now small{color:var(--text)}
  .bar{height:2px;flex:1;background:rgba(255,79,123,.22);margin-bottom:22px}
  .bar.filled{background:var(--primary)}
  .who{background:var(--bg2);border-radius:14px;padding:14px 16px;text-align:left;font-size:.86rem;color:var(--text-soft);margin-bottom:22px}
  .who b{color:var(--text);font-weight:500}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{padding:12px 24px;border-radius:30px;font:500 .88rem 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;border:0;transition:.25s}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.primary:hover{background:#e03565}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid rgba(255,79,123,.35)}
  .btn.ghost:hover{border-color:var(--primary)}
  .note{margin-top:20px;font-size:.78rem;color:var(--text-soft)}
  .script{font-family:'Dancing Script',cursive;color:var(--pink-light);font-size:1.15rem}
  @media(max-width:520px){.card{padding:34px 22px}h1{font-size:1.45rem}.node small{font-size:.62rem}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lw-core.js?v=3"></script>
</head>
<body class="font-sans bg-bg text-text min-h-screen flex items-center justify-center px-5 py-10">
<div class="glow"></div>
<div class="lang-switcher" aria-label="Language selector">
  <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
  <button class="lang-btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
  <button class="lang-btn" data-lang="braj" onclick="setLanguage('braj')">ब्रज</button>
  <button class="lang-btn" data-lang="raj" onclick="setLanguage('raj')">राजस्थानी</button>
  <button class="lang-btn" data-lang="bho" onclick="setLanguage('bho')">भोजपुरी</button>
  <button class="lang-btn" data-lang="hyd" onclick="setLanguage('hyd')">हैदराबादी</button>
  <button class="lang-btn" data-lang="mr" onclick="setLanguage('mr')">मराठी</button>
</div>

<div class="card bad" id="card">
  <div class="auth-logo h-[62px] max-[520px]:h-12"><img src="logo.png" alt="Loveway" width="340" height="185" class="h-full w-auto inline-block"></div>
  <div class="stamp">✕</div>
  <h1 id="title" data-i18n="rejectedTitle"></h1>
  <div class="sub" id="sub" data-i18n="rejectedSub"></div>

  <div id="alertBox" class="alert"></div>

  <div class="who" id="who" style="display:none"></div>

  <div class="row">
    <a class="btn primary" href="contact.html" data-i18n="contactUs"></a>
    <button class="btn ghost" onclick="LW.logout()" data-i18n="signOut"></button>
  </div>

  <div class="note"><span class="script">Loveway</span></div>
</div>

<script>
/* blocked.html — sirf un accounts ke liye jinhe admin ne reject/block
   kiya hai. Approval ka intezaar wala step ab nahi hai: naya signup
   seedha approved hota hai, isliye baaki sab yahan se aage bhej diye
   jaate hain. */
async function check() {
  if (!LW.configOk) { LW.alert('config.js me SUPABASE_ANON_KEY set nahi hai.', 'error'); return; }

  const session = await LW.getSession();
  if (!session) { window.location.href = LW.pageUrl('login.html'); return; }

  const p = await LW.getProfile();
  if (!p) { window.location.href = LW.pageUrl('login.html'); return; }

  // block nahi hai? to yahan rukne ki zaroorat hi nahi
  if (p.status !== 'rejected') {
    window.location.replace(LW.pageUrl(LW.targetFor(p)));
    return;
  }

  const who = document.getElementById('who');
  who.style.display = 'block';
  who.innerHTML =
    '<b>' + LW.escapeHtml(p.full_name || p.username || '') + '</b><br>' +
    '@' + LW.escapeHtml(p.username || '—') + ' · ' + LW.escapeHtml(p.mobile || '—') + '<br>' +
    LW.escapeHtml(p.email || '');

  LW.alert('❌ ' + t('rejected'), 'error');
}

document.addEventListener('DOMContentLoaded', () => { check(); });
</script>
</body>
</html>
