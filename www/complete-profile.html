<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loveway — Complete Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700&family=DM+Sans:wght@300;400;500&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--pink:#FF4F7B;--pink-light:#FF85A1;--dark:#1A0A14;--dark2:#2D1525;--dark3:#3D1E30;--gold:#FFB347;--white:#FFF5F8;--text-muted:#C4849A}
  body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .glow{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,rgba(255,79,123,.15),transparent 60%);pointer-events:none}
  .lang-switcher{position:fixed;top:18px;right:22px;z-index:99;display:flex;gap:5px;padding:5px;background:rgba(45,21,37,.88);border:1px solid rgba(255,79,123,.25);border-radius:50px;backdrop-filter:blur(12px)}
  .lang-btn{border:0;background:transparent;color:var(--text-muted);padding:7px 10px;border-radius:30px;font:500 .72rem 'DM Sans',sans-serif;cursor:pointer;transition:.25s}
  .lang-btn:hover{color:var(--white)}
  .lang-btn.active{background:var(--pink);color:#fff}
  .card{position:relative;width:100%;max-width:520px;background:var(--dark2);border:1px solid rgba(255,79,123,.16);border-radius:26px;padding:40px 36px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
  .who{display:flex;align-items:center;gap:14px;margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid rgba(255,79,123,.14)}
  .pic{width:52px;height:52px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:500;overflow:hidden;flex-shrink:0}
  .pic img{width:100%;height:100%;object-fit:cover}
  .who b{display:block;font-weight:500;font-size:.98rem}
  .who small{color:var(--text-muted);font-size:.8rem}
  h1{font-family:'Playfair Display',serif;font-size:1.6rem;margin-bottom:6px}
  .sub{color:var(--text-muted);font-size:.9rem;margin-bottom:24px}
  .alert{display:none;margin-bottom:18px;padding:12px 15px;border-radius:12px;font-size:.87rem}
  .alert.error{display:block;background:rgba(255,79,123,.1);border:1px solid rgba(255,79,123,.35);color:var(--pink-light)}
  .alert.success{display:block;background:rgba(120,220,150,.1);border:1px solid rgba(120,220,150,.32);color:#8fe0aa}
  .alert.warning{display:block;background:rgba(255,179,71,.1);border:1px solid rgba(255,179,71,.32);color:var(--gold)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .fg.full{grid-column:1/-1}
  label{font-size:.8rem;color:var(--text-muted)}
  input{width:100%;padding:12px 14px;background:var(--dark);border:1px solid rgba(255,79,123,.18);border-radius:12px;color:var(--white);font:400 .92rem 'DM Sans',sans-serif;outline:0;transition:.2s}
  input:focus{border-color:var(--pink)}
  input::placeholder{color:rgba(196,132,154,.6)}
  .hint{font-size:.73rem;color:var(--text-muted)}
  .hint.ok{color:#8fe0aa}
  .hint.bad{color:var(--pink-light)}
  .gender{display:flex;gap:8px}
  .gopt{flex:1;text-align:center;padding:11px 4px;background:var(--dark);border:1px solid rgba(255,79,123,.18);border-radius:12px;font-size:.84rem;cursor:pointer;transition:.2s}
  .gopt:hover{border-color:var(--pink-light)}
  .gopt.active{background:rgba(255,79,123,.14);border-color:var(--pink);color:var(--white)}
  .btn{width:100%;padding:14px;background:var(--pink);color:#fff;border:0;border-radius:30px;font:500 .95rem 'DM Sans',sans-serif;cursor:pointer;margin-top:6px;transition:.25s}
  .btn:hover:not(:disabled){background:#e03565}
  .btn:disabled{opacity:.6;cursor:default}
  .foot{margin-top:18px;text-align:center;font-size:.83rem;color:var(--text-muted)}
  .foot a{color:var(--pink-light);text-decoration:none;cursor:pointer}
  @media(max-width:520px){.card{padding:30px 20px}.grid{grid-template-columns:1fr}h1{font-size:1.4rem}}

  /* shared Loveway mark — sab pre-login pages par ek jaisa */
  .lw-mark{text-align:center;margin-bottom:18px}
  .lw-mark img{height:62px;width:auto;object-fit:contain;display:inline-block;
    filter:drop-shadow(0 4px 16px rgba(255,79,123,.35))}
  @media(max-width:520px){.lw-mark img{height:48px}}

  /* 7 bhaashaayein — chhoti screen par pill swipe hoti hai, katati nahi */
  .lang-switcher{max-width:calc(100vw - 36px);flex-wrap:nowrap;overflow-x:auto;
    scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
  .lang-switcher::-webkit-scrollbar{display:none}
  .lang-btn{flex:0 0 auto;white-space:nowrap}
  @media(max-width:560px){
    .lang-switcher{left:10px;right:10px;max-width:none;justify-content:flex-start}
    .lang-btn{padding:6px 9px;font-size:.66rem}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="lw-core.js?v=2"></script>
</head>
<body>
<div class="glow"></div>
<div class="lang-switcher" aria-label="Language selector">
  <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">English</button>
  <button class="lang-btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
  <button class="lang-btn" data-lang="braj" onclick="setLanguage('braj')">ब्रज</button>
  <button class="lang-btn" data-lang="raj" onclick="setLanguage('raj')">राजस्थानी</button>
  <button class="lang-btn" data-lang="bho" onclick="setLanguage('bho')">भोजपुरी</button>
  <button class="lang-btn" data-lang="hyd" onclick="setLanguage('hyd')">हैदराबादी</button>
  <button class="lang-btn" data-lang="mr" onclick="setLanguage('mr')">मराठी</button>
</div>

<div class="card">
    <div class="lw-mark"><img src="logo.png" alt="Loveway" width="340" height="185"></div>
  <div class="who">
    <div class="pic" id="pic">•</div>
    <div>
      <b id="whoName">—</b>
      <small id="whoMeta">—</small>
    </div>
  </div>

  <h1 data-i18n="completeTitle"></h1>
  <div class="sub" data-i18n="completeSub"></div>

  <div id="alertBox" class="alert"></div>

  <div class="grid">
    <div class="fg full">
      <label data-i18n="fullName"></label>
      <input type="text" id="fullName" data-i18n-placeholder="fullNamePh">
    </div>
    <div class="fg">
      <label data-i18n="username"></label>
      <input type="text" id="username" autocomplete="username" data-i18n-placeholder="placeholderUser">
      <span class="hint" id="uHint"></span>
    </div>
    <div class="fg">
      <label data-i18n="mobile"></label>
      <input type="tel" id="mobile" data-i18n-placeholder="placeholderMobile">
    </div>
    <div class="fg full">
      <label data-i18n="address"></label>
      <input type="text" id="address" data-i18n-placeholder="addressPh">
    </div>
    <div class="fg">
      <label data-i18n="gender"></label>
      <div class="gender">
        <div class="gopt active" data-val="male" onclick="pickGender(this)" data-i18n="male"></div>
        <div class="gopt" data-val="female" onclick="pickGender(this)" data-i18n="female"></div>
        <div class="gopt" data-val="other" onclick="pickGender(this)" data-i18n="other"></div>
      </div>
    </div>
    <div class="fg">
      <label data-i18n="dob"></label>
      <input type="date" id="dob">
    </div>
  </div>

  <button class="btn" id="saveBtn" onclick="saveProfile()" data-i18n="saveContinue"></button>
  <div class="foot"><a onclick="LW.logout()" data-i18n="signOut"></a></div>
</div>

<script>
/* Google / Spotify se aaye users ke paas username aur mobile
   nahi hota — wo yahan bharte hain, phir approval queue me. */
let gender = 'male';
let me = null;

function pickGender(el) {
  document.querySelectorAll('.gopt').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  gender = el.dataset.val;
}

/* username free hai ya nahi — type karte hi bata do */
let uTimer = null;
function watchUsername() {
  const input = document.getElementById('username');
  const hint  = document.getElementById('uHint');
  input.addEventListener('input', () => {
    const v = input.value.trim();
    hint.className = 'hint';
    hint.textContent = '';
    clearTimeout(uTimer);
    if (v.length < 3) return;
    uTimer = setTimeout(async () => {
      const { data } = await LW.sb.rpc('lw_username_available', { p_username: v });
      if (data === false && v.toLowerCase() !== String(me.username || '').toLowerCase()) {
        hint.className = 'hint bad';
        hint.textContent = t('userTaken');
      } else {
        hint.className = 'hint ok';
        hint.textContent = '✓';
      }
    }, 400);
  });
}

async function saveProfile() {
  const btn = document.getElementById('saveBtn');
  const patch = {
    full_name: document.getElementById('fullName').value.trim(),
    username:  document.getElementById('username').value.trim(),
    mobile:    LW.normalizeMobile(document.getElementById('mobile').value.trim()),
    address:   document.getElementById('address').value.trim() || null,
    gender:    gender,
    dob:       document.getElementById('dob').value || null
  };

  if (!patch.full_name || !patch.username || !patch.mobile) {
    LW.alert(t('fillRequired'), 'error'); return;
  }
  if (patch.username.length < 3) {
    LW.alert(t('userTaken'), 'error'); return;
  }

  btn.disabled = true;
  btn.textContent = t('sending');
  LW.hideAlert();

  const { error } = await LW.sb.from('profiles').update(patch).eq('id', me.id);
  if (error) {
    const dup = String(error.message || '').toLowerCase().includes('duplicate');
    LW.alert('❌ ' + (dup ? t('userTaken') : LW.errText(error)), 'error');
    btn.disabled = false; btn.textContent = t('saveContinue');
    return;
  }

  LW.alert('✅ ' + t('signupOk'), 'success');
  Object.assign(me, patch);
  setTimeout(() => { window.location.href = LW.pageUrl(LW.targetFor(me)); }, 700);
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!LW.configOk) { LW.alert('config.js me SUPABASE_ANON_KEY set nahi hai.', 'error'); return; }

  const session = await LW.getSession();
  if (!session) { window.location.href = LW.pageUrl('login.html'); return; }

  me = await LW.getProfile();
  if (!me) { LW.alert(t('noProfile'), 'error'); return; }

  // already poora hai to aage bhej do
  if (me.username && me.mobile) {
    window.location.replace(LW.pageUrl(LW.targetFor(me)));
    return;
  }

  const name = me.full_name || session.user.email || '';
  document.getElementById('whoName').textContent = name;
  document.getElementById('whoMeta').textContent = me.email || session.user.email || '';
  const pic = document.getElementById('pic');
  if (me.avatar_url) pic.innerHTML = '<img alt="" src="' + LW.escapeHtml(me.avatar_url) + '">';
  else pic.textContent = (name || '?').trim().charAt(0).toUpperCase();

  document.getElementById('fullName').value = me.full_name || '';
  document.getElementById('username').value = me.username || '';
  document.getElementById('mobile').value   = me.mobile || '';
  document.getElementById('address').value  = me.address || '';
  if (me.dob) document.getElementById('dob').value = me.dob;
  if (me.gender) {
    const g = document.querySelector('.gopt[data-val="' + me.gender + '"]');
    if (g) pickGender(g);
  }

  watchUsername();
  LW.alert('⏳ ' + t('completeSub'), 'warning');
});
</script>
</body>
</html>
